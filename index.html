有老化、裸露现象", "source": "依据《光伏发电设备维护与检修》华电集团有限公司 2023 版 第十三章第二节第一部分", "keywords": ["桩基检查", "连接与节点检查", "地基基础检查", "防腐检查", "接地系统检查", "载荷与作用组合", "跟踪控制系统检查", "驱动单元检查", "支撑传动单元检查", "转动主梁单元检查", "阻尼器检查", "电缆检查"], "criterion": "", "answerHtml": "（1）\u003cspan class=\"kw\"\u003e桩基检查\u003c/span\u003e，混凝土基础有无沉降、位移、开裂、剥落、风化、露筋； PHC 管桩是否有沉降、开裂、倾斜。 （2）变形、构件与结构体系检查，检查支架结构件檩条、支架梁、支架柱、斜撑等是否有变形，结构体系是否发生损坏。 （3）\u003cspan class=\"kw\"\u003e连接与节点检查\u003c/span\u003e，检查连接件/转接件之间栓接或焊接节点应无松动或脱焊、变形迹象。 （4）\u003cspan class=\"kw\"\u003e地基基础检查\u003c/span\u003e，检查软弱地基、山区地基、湿陷性黄土地基、膨胀土地基、冻土地基等特殊性土地基础区域应检查是否有基础变形，有无潜在风险或直接危害的滑坡、泥石流、崩塌、滚石等。 （5）\u003cspan class=\"kw\"\u003e防腐检查\u003c/span\u003e，检查支架防腐保护层外观检查，涂层破损情况，有无鼓泡脱漆、剥落开裂、腐蚀生锈迹象，测定金属性结构件防腐镀层漆膜厚度达标，金属性支架年度腐蚀速率满足标准要求。 （6）\u003cspan class=\"kw\"\u003e接地系统检查\u003c/span\u003e，检查各部件接地是否连接可靠，铜编织带是否有断股、断开现象，栓接或焊接节点应无松动或脱焊、变形迹象。 （7）\u003cspan class=\"kw\"\u003e载荷与作用组合\u003c/span\u003e（风、雪）检查，恶劣风雪天气前，针对跟踪光伏支架系统应检查其风雪模式是否正常运行。 （8）\u003cspan class=\"kw\"\u003e跟踪控制系统检查\u003c/span\u003e，检查跟踪系统通信是否正常，屏蔽与接地是否良好；箱体密封应良好，内部无异音、异味，电源指示灯正常。 （9）\u003cspan class=\"kw\"\u003e驱动单元检查\u003c/span\u003e，检查电机、减速机电源是否正常，安装是否紧固，有无松动：轴承是否有异响、发热、漏油迹象，防护罩是否完整，外观检查是否有裂纹；地脚接地是否正常，周围有无影响其正常运行的异物、不 利因素。 （10）\u003cspan class=\"kw\"\u003e支撑传动单元检查\u003c/span\u003e，检查与主轴推杆连接件、立柱连接是否紧固可靠，有无偏移倾斜迹象。 （11）\u003cspan class=\"kw\"\u003e转动主梁单元检查\u003c/span\u003e，检查主梁、轴承座与轴承连接是否可靠：主梁是否在一条水平线上；限位角钢与硬限位是否有移位、变形；转动轴承有无移位、外滑迹象。 （12）\u003cspan class=\"kw\"\u003e阻尼器检查\u003c/span\u003e，检查阻尼器与主梁、立柱梁连接是否可靠，螺栓是否紧固，阻尼器外观有无破损、损坏，运行有无异常情况。 （13）\u003cspan class=\"kw\"\u003e电缆检查\u003c/span\u003e，检查电缆是否有老化、裸露现象"}, {"id": 566, "sec": "问答题", "secIdx": 6, "type": "问答题", "num": 2, "text": "简述振动状态监测分类及选择原则。", "options": [], "answer": "振动状态监测可采用以下三种类型的传感器: （1）加速度传感器; （2）速度传感器; （3）位移传感器。 传感器选择 （1） 加速度传感器 A、高温或强磁场环境振动状态监测应优先选择加速度传感器。 B、风电机组滚动轴承和齿轮箱的状态监测应选择加速度传感器。 （2） 速度传感器 风电机组机舱和塔架的状态监测应选择加速度或速度传感器。 （3）位移传感器 风电机组主轴轴向位移的状态监测应选择位移传感器", "source": "依据 NB/T 31004-2011《风力发电机组振动状态监测导则》 ", "keywords": ["加速度传感器", "速度传感器", "位移传感器", "加速度传感器 A"], "criterion": "", "answerHtml": "振动状态监测可采用以下三种类型的传感器: （1）\u003cspan class=\"kw\"\u003e加\u003cspan class=\"kw\"\u003e速度传感器\u003c/span\u003e\u003c/span\u003e; （2）速度传感器; （3）\u003cspan class=\"kw\"\u003e位移传感器\u003c/span\u003e。 传感器选择 （1） \u003cspan class=\"kw\"\u003e加速度传感器 A\u003c/span\u003e、高温或强磁场环境振动状态监测应优先选择加速度传感器。 B、风电机组滚动轴承和齿轮箱的状态监测应选择加速度传感器。 （2） 速度传感器 风电机组机舱和塔架的状态监测应选择加速度或速度传感器。 （3）位移传感器 风电机组主轴轴向位移的状态监测应选择位移传感器"}, {"id": 567, "sec": "问答题", "secIdx": 6, "type": "问答题", "num": 3, "text": "依据《光伏发电设备维护与检修》第三章第二节第二部分的规定：集中式并网光伏发电系统分别有哪些优点和缺点？", "options": [], "answer": "（1）集中式并网光伏发电系统的优点： 1）由于选址灵活，光伏电站稳定性有所增加，并且充分利用太阳辐射与用电负荷的正调峰特性，起到削峰的作用。 2）运行方式较为灵活，可以更方便地进行无功和电压控制，参加电网频率调节也更容易实现。 3）环境适应能力强，不需要水源、燃煤运输等原料保障，运行成本低，便于集中管理，受到空间的限制小，很容易实现扩容。 （2）集中式并网光伏发电系统的缺点： 1）需要依赖远距离输电线路送电入网，同时自身也是电网的一个较大的干扰源，输电线路的损耗、电压跌落、无功补偿等问题会更加突出。 2）大型地面并网光伏电站由于远离负荷中心，所发电能不能就地消纳，在用电低谷时段，会导致弃光弃电现象。 3）前期、并网手续复杂，建设周期相对较长。 4）为保证电网安全，大型地面并网光伏电站接入公共电网需要有低电压穿越等技术要求，而这一技术往往与孤岛保护存在冲突", "source": "依据《光伏发电设备维护与检修》华电集团有限公司 2023 版 第三章第二节第二部分", "keywords": ["集中式并网光伏发电系统的优点", "由于选址灵活", "运行方式较为灵活", "环境适应能力强", "集中式并网光伏发电系统的缺点", "需要依赖远距离输电线路送电入网", "为保证电网安全"], "criterion": "", "answerHtml": "（1）\u003cspan class=\"kw\"\u003e集中式并网光伏发电系统的优点\u003c/span\u003e： 1）\u003cspan class=\"kw\"\u003e由于选址灵活\u003c/span\u003e，光伏电站稳定性有所增加，并且充分利用太阳辐射与用电负荷的正调峰特性，起到削峰的作用。 2）\u003cspan class=\"kw\"\u003e运行方式较为灵活\u003c/span\u003e，可以更方便地进行无功和电压控制，参加电网频率调节也更容易实现。 3）\u003cspan class=\"kw\"\u003e环境适应能力强\u003c/span\u003e，不需要水源、燃煤运输等原料保障，运行成本低，便于集中管理，受到空间的限制小，很容易实现扩容。 （2）\u003cspan class=\"kw\"\u003e集中式并网光伏发电系统的缺点\u003c/span\u003e： 1）\u003cspan class=\"kw\"\u003e需要依赖远距离输电线路送电入网\u003c/span\u003e，同时自身也是电网的一个较大的干扰源，输电线路的损耗、电压跌落、无功补偿等问题会更加突出。 2）大型地面并网光伏电站由于远离负荷中心，所发电能不能就地消纳，在用电低谷时段，会导致弃光弃电现象。 3）前期、并网手续复杂，建设周期相对较长。 4）\u003cspan class=\"kw\"\u003e为保证电网安全\u003c/span\u003e，大型地面并网光伏电站接入公共电网需要有低电压穿越等技术要求，而这一技术往往与孤岛保护存在冲突"}, {"id": 568, "sec": "问答题", "secIdx": 6, "type": "问答题", "num": 4, "text": "依据《GB/T 19964-2012 光伏发电站接入电力系统技术规定》第 4.2条的规定：正常运行情况下，光伏发电站有功功率变化有哪些要求？", "options": [], "answer": "（1）在光伏发电站并网、正常停机以及太阳能辐照度增长过程中，光伏发电站有功功率变化速率应满足电力系统安全稳定运行的要求，其限值应根据所接入电力系统的频率调节特性，由电网调度机构确定。 （2）光伏发电站有功功率变化速率应不超过 10%装机容量/min，允许出现因太阳能辐照度降低而引起的光伏发电站有功功率变化速率超出限值的情况", "source": "依据 GB/T 19964-2012《光伏发电站接入电力系统技术规定》第 4.2条", "keywords": ["10%", "在光伏发电站并网"], "criterion": "", "answerHtml": "（1）\u003cspan class=\"kw\"\u003e在光伏发电站并网\u003c/span\u003e、正常停机以及太阳能辐照度增长过程中，光伏发电站有功功率变化速率应满足电力系统安全稳定运行的要求，其限值应根据所接入电力系统的频率调节特性，由电网调度机构确定。 （2）光伏发电站有功功率变化速率应不超过 \u003cspan class=\"kw\"\u003e10%\u003c/span\u003e装机容量/min，允许出现因太阳能辐照度降低而引起的光伏发电站有功功率变化速率超出限值的情况"}, {"id": 569, "sec": "问答题", "secIdx": 6, "type": "问答题", "num": 5, "text": "单芯电缆为什么不采用钢带铠装层？", "options": [], "answer": "单芯电缆护层采用钢带铠装，当导体通过电流时，将产生交变磁场，由于这个磁场的作用，在钢带上会感应出一个感应电压；且电缆钢带在线路两端接地而形成一个闭合回路时，感应电压就会产生感应电流，使电缆发热导致绝缘损坏，所以必须降低电缆载流量。为了避免这种情况，因此单芯电缆的护层铠装不采用钢带，而采用非磁性材料", "source": "", "keywords": ["单芯电缆护层采用钢带铠装"], "criterion": "", "answerHtml": "\u003cspan class=\"kw\"\u003e单芯电缆护层采用钢带铠装\u003c/span\u003e，当导体通过电流时，将产生交变磁场，由于这个磁场的作用，在钢带上会感应出一个感应电压；且电缆钢带在线路两端接地而形成一个闭合回路时，感应电压就会产生感应电流，使电缆发热导致绝缘损坏，所以必须降低电缆载流量。为了避免这种情况，因此单芯电缆的护层铠装不采用钢带，而采用非磁性材料"}, {"id": 570, "sec": "问答题", "secIdx": 6, "type": "问答题", "num": 6, "text": "依据 GB/T 19964-2012《光伏发电站接入电力系统技术规定》第 8.1条：请简述光伏发电站应满足的低电压穿越要求，并作图说明。", "options": [], "answer": "（1）光伏发电站并网点电压跌至 0 时，光伏发电站应能不脱网运行 0.15s； （2）光伏发电站并网点电压曲线跌至曲线 1 以下时，光伏发电站可以从电网切出", "source": "依据 GB/T 19964-2012《光伏发电站接入电力系统技术规定》第 8.1条", "keywords": ["0.15s", "光伏发电站并网点电压跌至 0 时"], "criterion": "", "answerHtml": "（1）\u003cspan class=\"kw\"\u003e光伏发电站并网点电压跌至 0 时\u003c/span\u003e，光伏发电站应能不脱网运行 \u003cspan class=\"kw\"\u003e0.15s\u003c/span\u003e； （2）光伏发电站并网点电压曲线跌至曲线 1 以下时，光伏发电站可以从电网切出"}, {"id": 571, "sec": "问答题", "secIdx": 6, "type": "问答题", "num": 7, "text": "【依据 NB∕T 10559-2021《 风力发电场监控自动化技术监督规程》】简要叙述风力发电机组安全链的作用。", "options": [], "answer": "风力发电机组的安全链系统的等级比控制系统要优先，其目的是确保风力发电设备在出现故障时，设备始终处于安全状态。分为一般保护和紧急保护。 （1）一般保护响应后将风力发电机组停机，这种全过程都在控制系统控制下进行的停机称为正常停机。如过/欠电压保护、过电流保护、主轴承过热保护、发电机绕组及轴承过热保护、齿轮箱过热保护、制动片过热保护、齿轮箱及液压站油位低保护等。机组自动停机后，如果引起自动停机的原因能够自动消除，一般允许风力发电机组重新自动启动。如果故障节点得不到恢复，整个风力发电机组的正常操作都不能实现。 （2）紧急保护对应的安全链保护是风力发电机组的最后一道保护，它处于风力发电机组的软件保护之后，是独立于控制系统程序的硬件保护措施，即使控制系统发生异常，也不会影响安全链的正常动作。安全链引起的紧急停机，只能通过手动复位才能重新启动", "source": "依据《风力发电基础理论知识》中国华电集团有限公司 2023 版", "keywords": ["一般保护响应后将风力发电机组停机"], "criterion": "", "answerHtml": "风力发电机组的安全链系统的等级比控制系统要优先，其目的是确保风力发电设备在出现故障时，设备始终处于安全状态。分为一般保护和紧急保护。 （1）\u003cspan class=\"kw\"\u003e一般保护响应后将风力发电机组停机\u003c/span\u003e，这种全过程都在控制系统控制下进行的停机称为正常停机。如过/欠电压保护、过电流保护、主轴承过热保护、发电机绕组及轴承过热保护、齿轮箱过热保护、制动片过热保护、齿轮箱及液压站油位低保护等。机组自动停机后，如果引起自动停机的原因能够自动消除，一般允许风力发电机组重新自动启动。如果故障节点得不到恢复，整个风力发电机组的正常操作都不能实现。 （2）紧急保护对应的安全链保护是风力发电机组的最后一道保护，它处于风力发电机组的软件保护之后，是独立于控制系统程序的硬件保护措施，即使控制系统发生异常，也不会影响安全链的正常动作。安全链引起的紧急停机，只能通过手动复位才能重新启动"}, {"id": 572, "sec": "问答题", "secIdx": 6, "type": "问答题", "num": 8, "text": "依据《光伏发电设备维护与检修》第十四章第二节第二部分的规定：组串式逆变器的性能测试内容主要有哪些？", "options": [], "answer": "（1）外观与结构检查； （2）环境适应性测试：低温工作测试、高温工作测试、恒定湿热存储测试、盐雾测试； （3）安全性能测试：可触及性测试、保护连接测试、绝缘强度测试、局部放电测试、接触电流测试、脉冲电压测试、存储电荷放电测试、温升测 试、稳定性测试、搬运测试、短路保护、噪声测试、光伏方阵绝缘阻抗检测能力测试、光伏方阵残余电流检测能力测试； （4）电气性能测试：有功功率、无功功率、电能质量、故障穿越； （5）通信测试； （6）电磁兼容性测试； （7）效率测试； （8）标识耐久性测试； （9）包装、运输和储存", "source": "依据《光伏发电设备维护与检修》华电集团有限公司 2023 版 第十四章第二节第二部分", "keywords": ["外观与结构检查", "环境适应性测试", "安全性能测试", "电气性能测试", "通信测试", "电磁兼容性测试", "效率测试", "标识耐久性测试"], "criterion": "", "answerHtml": "（1）\u003cspan class=\"kw\"\u003e外观与结构检查\u003c/span\u003e； （2）\u003cspan class=\"kw\"\u003e环境适应性测试\u003c/span\u003e：低温工作测试、高温工作测试、恒定湿热存储测试、盐雾测试； （3）\u003cspan class=\"kw\"\u003e安全性能测试\u003c/span\u003e：可触及性测试、保护连接测试、绝缘强度测试、局部放电测试、接触电流测试、脉冲电压测试、存储电荷放电测试、温升测 试、稳定性测试、搬运测试、短路保护、噪声测试、光伏方阵绝缘阻抗检测能力测试、光伏方阵残余电流检测能力测试； （4）\u003cspan class=\"kw\"\u003e电气性能测试\u003c/span\u003e：有功功率、无功功率、电能质量、故障穿越； （5）\u003cspan class=\"kw\"\u003e通信测试\u003c/span\u003e； （6）\u003cspan class=\"kw\"\u003e电磁兼容性测试\u003c/span\u003e； （7）\u003cspan class=\"kw\"\u003e效率测试\u003c/span\u003e； （8）\u003cspan class=\"kw\"\u003e标识耐久性测试\u003c/span\u003e； （9）包装、运输和储存"}, {"id": 573, "sec": "问答题", "secIdx": 6, "type": "问答题", "num": 9, "text": "依据《光伏发电设备维护与检修》第三章第一节的规定：请简述光伏逆变器的主要功能和按运行方式的不同可分为哪几类？", "options": [], "answer": "（1）光伏逆变器的主要功能是把光伏组件输出的直流电能尽可能多地转换成交流电能，提供给电网或者用户使用。 （2）光伏逆变器按运行方式不同，可分为并网逆变器和离网逆变器。并网逆变器用于并网运行的光伏发电系统；离网逆变器用于独立运行的光伏发电系统", "source": "依据《光伏发电设备维护与检修》华电集团有限公司 2023 版 第三章第一节", "keywords": ["光伏逆变器按运行方式不同"], "criterion": "", "answerHtml": "（1）光伏逆变器的主要功能是把光伏组件输出的直流电能尽可能多地转换成交流电能，提供给电网或者用户使用。 （2）\u003cspan class=\"kw\"\u003e光伏逆变器按运行方式不同\u003c/span\u003e，可分为并网逆变器和离网逆变器。并网逆变器用于并网运行的光伏发电系统；离网逆变器用于独立运行的光伏发电系统"}, {"id": 574, "sec": "问答题", "secIdx": 6, "type": "问答题", "num": 10, "text": "依据《光伏发电设备维护与检修》第四章第二节第二部分的规定：什么是光生伏特效应？", "options": [], "answer": "（1）光生伏特效应就是当物体受光照时，在吸收光能的基础上，物体内的电荷分布状态发生变化而产生电动势和电流的一种效应。当 P 区半导体和 N 区半导体结合在一起，形成P-N 结时，由于多数载流子的扩散，形成了空间电荷区，并形成一个不断增强的从 N 型半导体指向 P 型半导体的内建电场，导致多数载流子反向漂移。达到平衡后，扩散产生的电流和漂移产生的电流相等。如果光照在 P-N 结上，而且光能大于 P-N 结的禁带宽度，则在 P-N 结附近将产生电子－空穴对。由于内建电场的存在，产生的非平衡电子载流子将向空间电荷区两端漂移，产生光生电势（电压），破坏了原来的平衡。如果将 P-N 结合外电路相连，则电路中出现电流，称为光生伏特现象或光生伏特效应，是太阳能光电池的基本原理", "source": "依据《光伏发电设备维护与检修》华电集团有限公司 2023 版 第四章第二节第二部分", "keywords": ["光生伏特效应就是当物体受光照时"], "criterion": "", "answerHtml": "（1）\u003cspan class=\"kw\"\u003e光生伏特效应就是当物体受光照时\u003c/span\u003e，在吸收光能的基础上，物体内的电荷分布状态发生变化而产生电动势和电流的一种效应。当 P 区半导体和 N 区半导体结合在一起，形成P-N 结时，由于多数载流子的扩散，形成了空间电荷区，并形成一个不断增强的从 N 型半导体指向 P 型半导体的内建电场，导致多数载流子反向漂移。达到平衡后，扩散产生的电流和漂移产生的电流相等。如果光照在 P-N 结上，而且光能大于 P-N 结的禁带宽度，则在 P-N 结附近将产生电子－空穴对。由于内建电场的存在，产生的非平衡电子载流子将向空间电荷区两端漂移，产生光生电势（电压），破坏了原来的平衡。如果将 P-N 结合外电路相连，则电路中出现电流，称为光生伏特现象或光生伏特效应，是太阳能光电池的基本原理"}, {"id": 575, "sec": "问答题", "secIdx": 6, "type": "问答题", "num": 11, "text": "依据《光伏发电设备维护与检修》第十三章第一节第一部分的规定：光伏组件的恶劣天气的重点巡视检查内容是什么？", "options": [], "answer": "恶劣天气的重点巡视检查 （1）7 级以上大风、沙尘暴等异常天气时，检查光伏组件是否与支架连接牢固、导线摆动情况及有无钩挂杂物； （2）雪天时，检查光伏组件表面积雪情况，检查接头发热部位，及时处理积雪、悬冰； （3）雷雨、冰雹天气后，检查光伏组件表面是否有损坏情况", "source": "依据《光伏发电设备维护与检修》华电集团有限公司 2023 版 第十三章第一节第一部分", "keywords": ["恶劣天气的重点巡视检查", "7 级以上大风", "雪天时"], "criterion": "", "answerHtml": "\u003cspan class=\"kw\"\u003e恶劣天气的重点巡视检查\u003c/span\u003e （1）\u003cspan class=\"kw\"\u003e7 级以上大风\u003c/span\u003e、沙尘暴等异常天气时，检查光伏组件是否与支架连接牢固、导线摆动情况及有无钩挂杂物； （2）\u003cspan class=\"kw\"\u003e雪天时\u003c/span\u003e，检查光伏组件表面积雪情况，检查接头发热部位，及时处理积雪、悬冰； （3）雷雨、冰雹天气后，检查光伏组件表面是否有损坏情况"}, {"id": 576, "sec": "问答题", "secIdx": 6, "type": "问答题", "num": 12, "text": "请简述风电机组偏航齿圈齿面磨损原因。", "options": [], "answer": "齿轮副的长期啮合运转；相互啮合的齿轮副齿侧间隙中渗入杂质；润滑脂严重缺失使得齿轮副处于干摩擦状态", "source": "依据《中国华电集团有限公司风电运行维护技能大赛理论培训题库》2020 版", "keywords": ["齿轮副的长期啮合运转"], "criterion": "", "answerHtml": "\u003cspan class=\"kw\"\u003e齿轮副的长期啮合运转\u003c/span\u003e；相互啮合的齿轮副齿侧间隙中渗入杂质；润滑脂严重缺失使得齿轮副处于干摩擦状态"}, {"id": 577, "sec": "问答题", "secIdx": 6, "type": "问答题", "num": 13, "text": "依据《光伏发电设备维护与检修》第十三章第一节第三部分的规定：组件功率衰减率是指什么？组件功率衰减率要求有哪些？", "options": [], "answer": "（1）组件功率衰减率是指在光伏组件标准测试条件（STC：25℃ , 大气质量 AM1.5，风速=0m/s,1000W/m²) 下，实测功率与标称功率之差与标称功率的比值。其计算公式为 （2）依据 T/GSEA002 依据《光伏组件功率衰减检验技术规范》组件功率衰减率要求如下： 衰减不满一年的，以首年衰减率要求为准；衰减超过一年但不是整年的，按现行衰减原则，应以月为单位折算至衰减时间，衰减率精确至小数点后两位", "source": "依据《光伏发电设备维护与检修》华电集团有限公司 2023 版 第十三章第一节第三部分", "keywords": ["25℃", "0m", "光伏组件功率衰减检验技术规范"], "criterion": "", "answerHtml": "（1）组件功率衰减率是指在光伏组件标准测试条件（STC：\u003cspan class=\"kw\"\u003e25℃\u003c/span\u003e , 大气质量 AM1.5，风速=\u003cspan class=\"kw\"\u003e0m\u003c/span\u003e/s,1000W/m²) 下，实测功率与标称功率之差与标称功率的比值。其计算公式为 （2）依据 T/GSEA002 依据《\u003cspan class=\"kw\"\u003e光伏组件功率衰减检验技术规范\u003c/span\u003e》组件功率衰减率要求如下： 衰减不满一年的，以首年衰减率要求为准；衰减超过一年但不是整年的，按现行衰减原则，应以月为单位折算至衰减时间，衰减率精确至小数点后两位"}, {"id": 578, "sec": "问答题", "secIdx": 6, "type": "问答题", "num": 14, "text": "每年对风电机组接地电阻进行测试其电阻值要求是多少？", "options": [], "answer": "每年（雷雨季节前）对风电机组接地电阻进行测试，电阻值不宜高于4 Ω ；对轮毂至塔架底部的引雷通道进行检查和测试，电阻值不应高于0.5 Ω ；测量叶片接闪器到其根部法兰之间的直流电阻，电阻值不应高于0.05 Ω", "source": "依据《集团公司防止风电机组重大设备事故技术要求》 中国华电生函〔2018〕351号", "keywords": ["4 Ω", "0.5 Ω", "0.05 Ω"], "criterion": "", "answerHtml": "每年（雷雨季节前）对风电机组接地电阻进行测试，电阻值不宜高于\u003cspan class=\"kw\"\u003e4 Ω\u003c/span\u003e ；对轮毂至塔架底部的引雷通道进行检查和测试，电阻值不应高于\u003cspan class=\"kw\"\u003e0.5 Ω\u003c/span\u003e ；测量叶片接闪器到其根部法兰之间的直流电阻，电阻值不应高于\u003cspan class=\"kw\"\u003e0.05 Ω\u003c/span\u003e"}, {"id": 579, "sec": "问答题", "secIdx": 6, "type": "问答题", "num": 15, "text": "依据《光伏发电设备维护与检修》第十四章第一节第三部分的规定：集中式逆变器冷却系统工作异常如何检修处理？", "options": [], "answer": "（1） 自然风冷逆变器：清除散热片污垢和覆盖的异物，清洗散热器件。 （2）强制风冷逆变器：检查风机供电回路是否正常，进/出口风道、风机 扇叶是否有异物堵塞，并对异物进行清理，检修风机驱动模块，清洗或更换防尘网，对异常风机进行更换。 （3）水冷型逆变器：对渗漏水接口处进行修复，更换破损水管及控制异常的模块，注入符合冷却要求的水质及水量的冷却水", "source": "依据《光伏发电设备维护与检修》华电集团有限公司 2023 版 第十四章第一节第三部分", "keywords": ["自然风冷逆变器", "强制风冷逆变器", "水冷型逆变器"], "criterion": "", "answerHtml": "（1） \u003cspan class=\"kw\"\u003e自然风冷逆变器\u003c/span\u003e：清除散热片污垢和覆盖的异物，清洗散热器件。 （2）\u003cspan class=\"kw\"\u003e强制风冷逆变器\u003c/span\u003e：检查风机供电回路是否正常，进/出口风道、风机 扇叶是否有异物堵塞，并对异物进行清理，检修风机驱动模块，清洗或更换防尘网，对异常风机进行更换。 （3）\u003cspan class=\"kw\"\u003e水冷型逆变器\u003c/span\u003e：对渗漏水接口处进行修复，更换破损水管及控制异常的模块，注入符合冷却要求的水质及水量的冷却水"}, {"id": 580, "sec": "问答题", "secIdx": 6, "type": "问答题", "num": 16, "text": "依据 GB/T 19964-2012《光伏发电站接入电力系统技术规定》第 3.9条和第 3.10 条的规定：孤岛现象的定义是什么？孤岛现象的分类有哪些？防孤岛的定义是什么？", "options": [], "answer": "（1）孤岛现象：包含负荷和电源的部分电网，从主网脱离后继续孤立运行的状态。 （2）孤岛现象可分为非计划性孤岛和计划性孤岛。非计划性孤岛指的是非计划、不受控地发生孤岛。计划性孤岛指的是按预先配置的控制策略，有计划地发生孤岛。 （3）防孤岛的定义：防止非计划性孤岛现象的发生", "source": "依据 GB/T 19964-2012《光伏发电站接入电力系统技术规定》第 3.9条和第 3.10 条", "keywords": ["孤岛现象", "防孤岛的定义"], "criterion": "", "answerHtml": "（1）\u003cspan class=\"kw\"\u003e孤岛现象\u003c/span\u003e：包含负荷和电源的部分电网，从主网脱离后继续孤立运行的状态。 （2）孤岛现象可分为非计划性孤岛和计划性孤岛。非计划性孤岛指的是非计划、不受控地发生孤岛。计划性孤岛指的是按预先配置的控制策略，有计划地发生孤岛。 （3）\u003cspan class=\"kw\"\u003e防孤岛的定义\u003c/span\u003e：防止非计划性孤岛现象的发生"}, {"id": 581, "sec": "问答题", "secIdx": 6, "type": "问答题", "num": 17, "text": "某 220kV 线路甲侧电流互感器变比为 1250/1A，乙侧电流互感器变比为 1200/5A，两侧保护距离Ⅱ段一次侧定值均为22Ω , 则甲、乙两侧距离Ⅱ段二次侧定值分别是多少?", "options": [], "answer": "由题可知，电压变比为 220000/ √3/100/ √3，倍率为 2200； 甲侧电流变比为 1250/1，倍率为 1250；乙侧电流变比为 1200/5，倍率为 240； 由欧姆定律 R=U/I 可知，甲侧电阻倍率为 2200/1250=1.76； 故甲侧二次值为 12.5 Ω ；乙侧电阻倍率为 2200/240=9.2，故乙侧二次值为 2.4 Ω", "source": "", "keywords": ["12.5 Ω", "2.4 Ω", "由题可知"], "criterion": "", "answerHtml": "\u003cspan class=\"kw\"\u003e由题可知\u003c/span\u003e，电压变比为 220000/ √3/100/ √3，倍率为 2200； 甲侧电流变比为 1250/1，倍率为 1250；乙侧电流变比为 1200/5，倍率为 240； 由欧姆定律 R=U/I 可知，甲侧电阻倍率为 2200/1250=1.76； 故甲侧二次值为 \u003cspan class=\"kw\"\u003e12.5 Ω\u003c/span\u003e ；乙侧电阻倍率为 2200/240=9.2，故乙侧二次值为 \u003cspan class=\"kw\"\u003e2.4 Ω\u003c/span\u003e"}, {"id": 582, "sec": "问答题", "secIdx": 6, "type": "问答题", "num": 18, "text": "根据《中国华电集团有限公司网络安全管理办法（试行）》要求，如何规范使用外部软件及插件？", "options": [], "answer": "（1）应使用主流的、成熟的外部软件及插件，避免采用非商用且无安全保证的外部软件及插件。 （2）集成外部软件及插件包括开源组件时，应重视接口交互的安全，充分考虑异常的处理", "source": "解析：【依据《中国华电集团有限公司网络安全管理办法（试行）》中国华电科信制〔2021〕275 号", "keywords": ["应使用主流的", "集成外部软件及插件包括开源组件时"], "criterion": "", "answerHtml": "（1）\u003cspan class=\"kw\"\u003e应使用主流的\u003c/span\u003e、成熟的外部软件及插件，避免采用非商用且无安全保证的外部软件及插件。 （2）\u003cspan class=\"kw\"\u003e集成外部软件及插件包括开源组件时\u003c/span\u003e，应重视接口交互的安全，充分考虑异常的处理"}, {"id": 583, "sec": "问答题", "secIdx": 6, "type": "问答题", "num": 19, "text": "什么是瓦斯保护?有哪些优缺点?", "options": [], "answer": "（1）当变压器内部发生故障时，变压器油将分解出大量气体，利用这种气体动作的保护装置称瓦斯保护； （2）瓦斯保护的动作速度快、灵敏度高，对变压器内部绕组匝间短路及油面降低、铁芯过热等本体内的任何故障有良好的反应能力，但对油箱外套管及连线上的故障反 应能力却很差", "source": "", "keywords": ["当变压器内部发生故障时", "瓦斯保护的动作速度快"], "criterion": "", "answerHtml": "（1）\u003cspan class=\"kw\"\u003e当变压器内部发生故障时\u003c/span\u003e，变压器油将分解出大量气体，利用这种气体动作的保护装置称瓦斯保护； （2）\u003cspan class=\"kw\"\u003e瓦斯保护的动作速度快\u003c/span\u003e、灵敏度高，对变压器内部绕组匝间短路及油面降低、铁芯过热等本体内的任何故障有良好的反应能力，但对油箱外套管及连线上的故障反 应能力却很差"}, {"id": 584, "sec": "问答题", "secIdx": 6, "type": "问答题", "num": 20, "text": "请简述电力行业网络安全工作的目标以及电力监控系统安全评估的时机和频度要求？", "options": [], "answer": "（1）电力行业网络安全工作的目标是建立健全网络安全保障体系和工作责任体系，提高网络安全防护能力，保障电力系统安全稳定运行和电力可靠供应。 （2）电力监控系统在上线投运之前、升级改造之后必须进行安全评估；已投入运行的系统应该定期进行安全评估，对于电力监控系统应该每年进行一次安全评估", "source": "依据《国家能源局关于印发电力监控系统安全防护总体方案等安全防护方案和评估规范的通知》 国能安全〔2015〕36 号\\附件 1 ∶ 电力监控系统安全防护总体方案", "keywords": ["电力监控系统在上线投运之前"], "criterion": "", "answerHtml": "（1）电力行业网络安全工作的目标是建立健全网络安全保障体系和工作责任体系，提高网络安全防护能力，保障电力系统安全稳定运行和电力可靠供应。 （2）\u003cspan class=\"kw\"\u003e电力监控系统在上线投运之前\u003c/span\u003e、升级改造之后必须进行安全评估；已投入运行的系统应该定期进行安全评估，对于电力监控系统应该每年进行一次安全评估"}, {"id": 585, "sec": "问答题", "secIdx": 6, "type": "问答题", "num": 21, "text": "开关设备检修维护项目及质量标准应符合什么要求？", "options": [], "answer": "（1）加强开关设备外绝缘的清扫或采取相应的防污闪措施； （2）当断路器大修时，应检查液压（气动）机构分、合闸阀的阀针脱机装置是否松动或变形； （3）GIS 设备应重点监督在解体性检修或局部解体性检修后回路电阻试验、局部放电试验和机械特性试验开展情况； （4）在大负荷前、经受短路电流冲击后必要时进行局放检测", "source": "依据《集团公司风力发电企业技术监督实施规范》中国华电生函〔2022〕480 号", "keywords": ["当断路器大修时", "在大负荷前"], "criterion": "", "answerHtml": "（1）加强开关设备外绝缘的清扫或采取相应的防污闪措施； （2）\u003cspan class=\"kw\"\u003e当断路器大修时\u003c/span\u003e，应检查液压（气动）机构分、合闸阀的阀针脱机装置是否松动或变形； （3）GIS 设备应重点监督在解体性检修或局部解体性检修后回路电阻试验、局部放电试验和机械特性试验开展情况； （4）\u003cspan class=\"kw\"\u003e在大负荷前\u003c/span\u003e、经受短路电流冲击后必要时进行局放检测"}, {"id": 586, "sec": "问答题", "secIdx": 6, "type": "问答题", "num": 22, "text": "依据《光伏发电设备维护与检修》第十三章第二节第二部分的规定：光伏支架的检修维护的内容主要有哪些（至少 8 项）？", "options": [], "answer": "（1）表面应无划痕、裂纹、变形和损坏，表面涂盖无开裂、脱落、锈蚀、涂装，镀锌层厚度应符合设计要求和 GB50797 依据《光伏发电站设计规范》的规定；标识应清巷、箱体无破损、变形焊缝、支架硬限位应完好、支架应无锈蚀，镀锌层厚度应无损伤。 （2）连接螺栓接线紧固度、可靠性检查处理。 （3）支架翘曲变形、柱顶偏移情况检查处理。 （4）支架稳定性检查处理。 （5）支架转动部位调整灵活性，高度角调节范围检查处理。 （6）驱动装置密封件密封情况检查处理。 （7）驱动装置齿轮卡涩、润滑油缺失检查和处理。 （8）控制箱内通信电缆、箱体密封及内部元件完好检查处理。 （9）防护窗和保护接地完好、可靠性检查处理。 （10）控制系统控制保护功能、风速、压力、角度等传感器检查处理。 （11）跟踪范围、精度检查处理", "source": "依据《光伏发电设备维护与检修》华电集团有限公司 2023 版 第十三章第二节第二部分", "keywords": ["表面应无划痕", "连接螺栓接线紧固度", "支架翘曲变形", "支架稳定性检查处理", "支架转动部位调整灵活性", "驱动装置密封件密封情况检查处理", "驱动装置齿轮卡涩", "控制箱内通信电缆", "防护窗和保护接地完好", "控制系统控制保护功能", "跟踪范围", "光伏发电站设计规范"], "criterion": "", "answerHtml": "（1）\u003cspan class=\"kw\"\u003e表面应无划痕\u003c/span\u003e、裂纹、变形和损坏，表面涂盖无开裂、脱落、锈蚀、涂装，镀锌层厚度应符合设计要求和 GB50797 依据《\u003cspan class=\"kw\"\u003e光伏发电站设计规范\u003c/span\u003e》的规定；标识应清巷、箱体无破损、变形焊缝、支架硬限位应完好、支架应无锈蚀，镀锌层厚度应无损伤。 （2）\u003cspan class=\"kw\"\u003e连接螺栓接线紧固度\u003c/span\u003e、可靠性检查处理。 （3）\u003cspan class=\"kw\"\u003e支架翘曲变形\u003c/span\u003e、柱顶偏移情况检查处理。 （4）\u003cspan class=\"kw\"\u003e支架稳定性检查处理\u003c/span\u003e。 （5）\u003cspan class=\"kw\"\u003e支架转动部位调整灵活性\u003c/span\u003e，高度角调节范围检查处理。 （6）\u003cspan class=\"kw\"\u003e驱动装置密封件密封情况检查处理\u003c/span\u003e。 （7）\u003cspan class=\"kw\"\u003e驱动装置齿轮卡涩\u003c/span\u003e、润滑油缺失检查和处理。 （8）\u003cspan class=\"kw\"\u003e控制箱内通信电缆\u003c/span\u003e、箱体密封及内部元件完好检查处理。 （9）\u003cspan class=\"kw\"\u003e防护窗和保护接地完好\u003c/span\u003e、可靠性检查处理。 （10）\u003cspan class=\"kw\"\u003e控制系统控制保护功能\u003c/span\u003e、风速、压力、角度等传感器检查处理。 （11）\u003cspan class=\"kw\"\u003e跟踪范围\u003c/span\u003e、精度检查处理"}, {"id": 587, "sec": "问答题", "secIdx": 6, "type": "问答题", "num": 23, "text": "下图为风电场有功功率各种控制模式图，请根据图示，分别写出对应的风电场有功功率控制模式。", "options": [], "answer": "图 1：限值模式，图 2：调整模式，图 3：斜率模式，图 4：差值模式，图 5：调频模式", "source": "依据 NB∕T31110-2017《风电场有功功率调节与控制技术规定》", "keywords": ["图 1"], "criterion": "", "answerHtml": "\u003cspan class=\"kw\"\u003e图 1\u003c/span\u003e：限值模式，图 2：调整模式，图 3：斜率模式，图 4：差值模式，图 5：调频模式"}, {"id": 588, "sec": "问答题", "secIdx": 6, "type": "问答题", "num": 24, "text": "依据 GB/T 19964-2012《光伏发电站接入电力系统技术规定》第 5.1条和 5.2 条的规定：光伏发电站功率预测的基本要求有哪些？预测曲线上报有哪些要求？", "options": [], "answer": "（1）基本要求：装机容量 10MW 及以上的光伏发电站应配置光伏发电功率预测系统，系统具有 0h-72h 短期光伏发电功率预测以及 15min～4h 超短期光伏发电功率预测功能。 （2）预测曲线上报：光伏发电站每 15min 自动向电网调度机构滚动上报未来 15min～4h 的光伏发电站发电功率预测曲线，预测值的时间分辨率为15min。光伏发电站每天按照电网调度机构规定的时间上报次日 0 时至 24时光伏发电站发电功率预测曲线，预测值的时间分辨率为 15min", "source": "依据 GB/T 19964-2012《光伏发电站接入电力系统技术规定》第 5.1条和 5.2 条", "keywords": ["10MW", "0h", "72h", "15min", "4h", "基本要求", "预测曲线上报"], "criterion": "", "answerHtml": "（1）\u003cspan class=\"kw\"\u003e基本要求\u003c/span\u003e：装机容量 \u003cspan class=\"kw\"\u003e10MW\u003c/span\u003e 及以上的光伏发电站应配置光伏发电功率预测系统，系统具有 \u003cspan class=\"kw\"\u003e0h\u003c/span\u003e-\u003cspan class=\"kw\"\u003e72h\u003c/span\u003e 短期光伏发电功率预测以及 \u003cspan class=\"kw\"\u003e15min\u003c/span\u003e～\u003cspan class=\"kw\"\u003e4h\u003c/span\u003e 超短期光伏发电功率预测功能。 （2）\u003cspan class=\"kw\"\u003e预测曲线上报\u003c/span\u003e：光伏发电站每 15min 自动向电网调度机构滚动上报未来 15min～4h 的光伏发电站发电功率预测曲线，预测值的时间分辨率为15min。光伏发电站每天按照电网调度机构规定的时间上报次日 0 时至 24时光伏发电站发电功率预测曲线，预测值的时间分辨率为 15min"}, {"id": 589, "sec": "问答题", "secIdx": 6, "type": "问答题", "num": 25, "text": "三相变压器空载合闸时励磁涌流的大小及波形特征与哪些因素有关?", "options" , "options": [], "answer": "（1）光伏组件的选型应符合 GB 50797 等相关标准的要求，选型过程应进行技术经济对比。 （2）光伏组件的类型、规格根据光伏发电站的容量和场址的光资源、场地面积、地形等因素进行选取。 （3）光伏组件的选型宜考虑以下技术因素： ①组件电压、峰值功率、转换效率、温度系数、内阻、组件尺寸和重量等性能参数。 ②组件在风沙、高温、潮湿、盐雾、强紫外等环境下使用的耐候性要求。 ③技术先进性", "source": "依据《中国华电集团有限公司光伏发电企业技术监督实施规范》 中国华电生函〔2022〕480 号 附录 A1.2", "keywords": ["光伏组件的类型", "光伏组件的选型宜考虑以下技术因素", "组件电压", "组件在风沙", "技术先进性"], "criterion": "", "answerHtml": "（1）光伏组件的选型应符合 GB 50797 等相关标准的要求，选型过程应进行技术经济对比。 （2）\u003cspan class=\"kw\"\u003e光伏组件的类型\u003c/span\u003e、规格根据光伏发电站的容量和场址的光资源、场地面积、地形等因素进行选取。 （3）\u003cspan class=\"kw\"\u003e光伏组件的选型宜考虑以下技术因素\u003c/span\u003e： ①\u003cspan class=\"kw\"\u003e组件电压\u003c/span\u003e、峰值功率、转换效率、温度系数、内阻、组件尺寸和重量等性能参数。 ②\u003cspan class=\"kw\"\u003e组件在风沙\u003c/span\u003e、高温、潮湿、盐雾、强紫外等环境下使用的耐候性要求。 ③\u003cspan class=\"kw\"\u003e技术先进性\u003c/span\u003e"}];
const KEY = 'om_qbank_v1';
const TYPES = ['单选题','多选题','判断题','填空题','简答题','问答题'];
const TYPE_CLS = {'单选题':'single','多选题':'multi','判断题':'judge','填空题':'fill','简答题':'essay','问答题':'essay'};
const LETTERS = ['A','B','C','D','E','F','G','H'];
let storageOk = true, storageWarned = false;
let state = loadState();
let practice = { sec:'全部', mode:'seq', queue:[], idx:0, selected:new Set(), answered:false, result:null, runId:0, orders:{} };
let browse = { sec:'全部', showAns:true, q:'', shown:50 };
let filtersOpen = !isNarrow();
let view = 'dash';
function isNarrow(){ return typeof window !== 'undefined' && window.innerWidth > 0 && window.innerWidth <= 640; }

function loadState(){
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return {records:{}, excluded:{}, settings:{shuffle:false}};
    const s = JSON.parse(raw);
    return {records: s.records || {}, excluded: s.excluded || {},
      settings: Object.assign({shuffle:false}, s.settings || {})};
  } catch(e) {
    storageOk = false;
    return {records:{}, excluded:{}, settings:{shuffle:false}};
  }
}
function saveState(){
  if (!storageOk) return;
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e) { storageOk = false; warnStorage(); }
}
function warnStorage(){
  if (storageWarned) return;
  storageWarned = true;
  showToast('当前浏览器禁止保存本地进度，记录仅在本次打开内有效');
}
function rec(id){ if(!state.records[id]) state.records[id] = {attempts:0, correct:0, wrong:0, last:null, note:''}; return state.records[id]; }
function isWrong(id){ const r = state.records[id]; return !!r && r.wrong > 0 && !state.excluded[id]; }
function wrongRate(id){ const r = state.records[id]; return r && r.attempts ? r.wrong / r.attempts : 0; }
function lastCorrect(id){ const r = state.records[id]; return !!r && r.wrong > 0 && r.last === 'correct'; }
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h = setTimeout(()=>t.classList.remove('show'), 1800);
}
function optionText(q, l){ const o = (q.options||[]).find(x => x.l === l); return o ? o.t : ''; }
function ansTexts(q){ return [...q.answer].map(l => optionText(q, l)); }
function isChoice(q){ return q.type === '单选题' || q.type === '多选题'; }

/* ---------- 选项乱序（仅选择题） ---------- */
function optionView(q){
  if (q.type === '判断题') return [{l:'正确', t:'正确', orig:'正确'}, {l:'错误', t:'错误', orig:'错误'}];
  if (!isChoice(q)) return [];
  if (!state.settings.shuffle) return q.options.map(o => ({l:o.l, t:o.t, orig:o.l}));
  const key = q.id + '#' + practice.runId;
  if (!practice.orders[key]) practice.orders[key] = shuffle(q.options.map((o, i) => i));
  return practice.orders[key].map((idx, i) => ({l:LETTERS[i], t:q.options[idx].t, orig:q.options[idx].l}));
}
function displayAnswerLetters(q){
  return optionView(q)
    .filter(o => q.type === '判断题' ? q.answer === o.orig : q.answer.includes(o.orig))
    .map(o => o.l).join('');
}
function toOriginalAnswer(q, selected){
  return optionView(q).filter(o => selected.has(o.l)).map(o => o.orig).sort().join('');
}
function optionTextsByLetters(q, letters){
  const v = optionView(q);
  return [...letters].map(l => { const o = v.find(x => x.l === l); return o ? o.t : ''; });
}

/* ---------- 填空题比对 ---------- */
function normFill(s){
  return String(s == null ? '' : s)
    .replace(/\s+/g, '')
    .replace(/[，。、；：！？,.;:!?"'“”‘’（）()《》<>]/g, '')
    .replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 65248))
    .toLowerCase();
}
function fillCorrect(input, answer){
  const a = normFill(answer), b = normFill(input);
  if (!b) return false;
  if (a === b) return true;
  return a.length >= 2 && b.indexOf(a) >= 0;
}

/* ---------- 统计 ---------- */
function stats(){
  const total = QBANK.length;
  let done=0, attempts=0, correct=0, wrong=0, wrongBook=0, mastered=0;
  QBANK.forEach(q => {
    const r = state.records[q.id];
    if (r && r.attempts > 0){ done++; attempts += r.attempts; correct += r.correct; wrong += r.wrong; }
    if (isWrong(q.id)) wrongBook++;
    if (lastCorrect(q.id)) mastered++;
  });
  return { total, done, undone: total-done, attempts, correct, wrong, wrongBook, mastered,
    rate: attempts ? Math.round(correct / attempts * 100) : 0 };
}
function secStat(sec){
  const qs = QBANK.filter(q => q.sec === sec);
  let done=0, attempts=0, correct=0, wrongBook=0;
  qs.forEach(q => {
    const r = state.records[q.id];
    if (r && r.attempts > 0){ done++; attempts += r.attempts; correct += r.correct; }
    if (isWrong(q.id)) wrongBook++;
  });
  return { n: qs.length, done, attempts, correct, wrongBook,
    rate: attempts ? Math.round(correct / attempts * 100) : 0 };
}
function wrongItems(){
  return QBANK.filter(q => isWrong(q.id)).sort((a, b) => {
    const ra = wrongRate(a.id), rb = wrongRate(b.id);
    if (rb !== ra) return rb - ra;
    const wa = state.records[a.id].wrong, wb = state.records[b.id].wrong;
    if (wb !== wa) return wb - wa;
    return a.id - b.id;
  });
}

/* ---------- 视图切换 ---------- */
function setView(v){
  view = v;
  ['viewDash','viewPractice','viewWrong','viewBrowse'].forEach(id =>
    document.getElementById(id).classList.toggle('hidden', id !== 'view' + v[0].toUpperCase() + v.slice(1)));
  if (v === 'dash') renderDash();
  if (v === 'wrong') renderWrong();
  if (v === 'practice') renderPractice();
  if (v === 'browse') renderBrowse();
}
function renderHeader(){
  const s = stats();
  document.getElementById('headChips').innerHTML =
    `<span class="chip">已做 <b>${s.done}</b> / ${s.total}</span>` +
    `<span class="chip">正确率 <b>${s.rate}%</b></span>` +
    `<span class="chip">错题本 <b>${s.wrongBook}</b></span>`;
}
function renderDash(){
  const s = stats();
  document.getElementById('statGrid').innerHTML = `
    <div class="stat"><div class="num">${s.total}</div><div class="label">总题数</div></div>
    <div class="stat"><div class="num">${s.done}</div><div class="label">已作答</div></div>
    <div class="stat"><div class="num">${s.undone}</div><div class="label">未作答</div></div>
    <div class="stat"><div class="num ${s.rate>=80?'ok':'bad'}">${s.rate}%</div><div class="label">正确率（答对 ${s.correct}/${s.attempts} 次）</div></div>
    <div class="stat"><div class="num bad">${s.wrongBook}</div><div class="label">错题本</div></div>
    <div class="stat"><div class="num ok">${s.mastered}</div><div class="label">错题已答对</div></div>`;
  document.getElementById('sectionBars').innerHTML = TYPES.map(sec => {
    const st = secStat(sec);
    const pct = st.done ? Math.round(st.done / st.n * 100) : 0;
    const cls = st.done === 0 ? '' : (st.done === st.n ? 'ok' : 'partial');
    return `<div class="bar-row">
      <div class="name">${sec}<small>${st.done}/${st.n} 已做 · 正确率 ${st.rate}% · 错题 ${st.wrongBook}</small></div>
      <div class="bar"><i class="${cls}" style="width:${pct}%"></i></div>
      <div class="pct">${pct}%</div>
      <button class="btn small ghost" data-browse="${sec}">查看</button>
    </div>`;
  }).join('');
}
function renderWrong(){
  const s = stats();
  const items = wrongItems();
  document.getElementById('wrongStats').innerHTML = `
    <div class="stat"><div class="num bad">${items.length}</div><div class="label">错题本（按错误率排序）</div></div>
    <div class="stat"><div class="num">${s.wrong}</div><div class="label">累计答错次数</div></div>
    <div class="stat"><div class="num ok">${s.mastered}</div><div class="label">错题已答对</div></div>`;
  const list = document.getElementById('wrongList');
  if (!items.length){
    list.innerHTML = `<div class="empty-tip">🎉 错题本为空。答错或自评“没答全”的题会自动收集到这里。</div>`;
    return;
  }
  list.innerHTML = items.map(q => {
    const r = state.records[q.id];
    const rate = Math.round(wrongRate(q.id) * 100);
    const short = q.answer.length > 40 ? q.answer.slice(0, 40) + '…' : q.answer;
    return `<div class="wrong-item">
      <div class="q-text">${renderQuestionText(q)}</div>
      <div class="meta">
        <span>${q.type} · 第 ${q.num} 题</span>
        <span style="color:var(--bad);font-weight:700;">错误率 ${rate}%</span>
        <span>答错 ${r.wrong} 次 / 共做 ${r.attempts} 次</span>
        ${r.last==='correct' ? '<span style="color:var(--ok)">最近一次答对</span>' : '<span style="color:var(--bad)">最近一次未通过</span>'}
        <span>参考答案：${esc(short)}</span>
      </div>
      <div class="ops">
        <button class="btn small primary" data-go="${q.id}">重练本题</button>
        <button class="btn small ghost" data-out="${q.id}">移出错题本</button>
      </div>
    </div>`;
  }).join('');
}

/* ---------- 练习 ---------- */
function modeLabel(m){ return {seq:'顺序练习', random:'随机练习', wrong:'错题重练'}[m] || m; }
function renderFilterSummary(){
  const el = document.getElementById('filterSummary');
  if (!el) return;
  el.textContent = (practice.sec === '全部' ? '全部题型' : practice.sec) + ' · ' + modeLabel(practice.mode) +
    (state.settings.shuffle ? ' · 选项乱序' : ' · 选项原序');
}
function applyFiltersVisibility(){
  const box = document.getElementById('practiceFilters');
  const btn = document.getElementById('btnToggleFilters');
  if (!box || !btn) return;
  box.classList.toggle('hidden', !filtersOpen);
  btn.textContent = filtersOpen ? '收起筛选 ▴' : '筛选设置 ▾';
}
function initFilters(){
  document.getElementById('fSec').innerHTML = `<option value="全部">全部题型</option>` +
    TYPES.map(t => `<option value="${t}">${t}（${QBANK.filter(q => q.type === t).length}）</option>`).join('');
  document.getElementById('fMode').innerHTML =
    `<button data-m="seq" class="on">顺序练习</button><button data-m="random">随机练习</button><button data-m="wrong">错题重练</button>`;
  document.getElementById('fShuffle').innerHTML =
    `<button data-s="0" class="on">原序</button><button data-s="1">乱序</button>`;
  document.getElementById('fSec').addEventListener('change', e => {
    practice.sec = e.target.value; renderFilterSummary(); renderPractice();
  });
  document.getElementById('fMode').addEventListener('click', e => {
    const b = e.target.closest('button[data-m]'); if(!b) return;
    practice.mode = b.dataset.m;
    document.querySelectorAll('#fMode button').forEach(x => x.classList.toggle('on', x === b));
    renderFilterSummary(); buildQueue(); renderPractice();
  });
  document.getElementById('fShuffle').addEventListener('click', e => {
    const b = e.target.closest('button[data-s]'); if(!b) return;
    state.settings.shuffle = b.dataset.s === '1';
    saveState();
    document.querySelectorAll('#fShuffle button').forEach(x => x.classList.toggle('on', x === b));
    practice.orders = {}; practice.runId++;
    practice.answered = false; practice.selected = new Set(); practice.result = null;
    renderFilterSummary(); renderPractice();
  });
  document.getElementById('btnToggleFilters').addEventListener('click', () => {
    filtersOpen = !filtersOpen; applyFiltersVisibility();
  });
  document.getElementById('btnBegin').addEventListener('click', () => {
    if (isNarrow()) filtersOpen = false;
    applyFiltersVisibility(); renderFilterSummary(); buildQueue(); renderPractice();
  });
}
function buildQueue(){
  let qs = QBANK.filter(q => practice.sec === '全部' || q.sec === practice.sec);
  if (practice.mode === 'wrong'){
    const rank = {};
    wrongItems().forEach((q, i) => { rank[q.id] = i; });
    qs = qs.filter(q => isWrong(q.id)).sort((a, b) => rank[a.id] - rank[b.id]);
  }
  if (practice.mode === 'random') qs = shuffle([...qs]);
  practice.queue = qs;
  practice.idx = 0;
  practice.answered = false;
  practice.revealed = false;
  practice.selected = new Set();
  practice.result = null;
  practice.runId++;
  practice.orders = {};
}
function renderPractice(){
  const qs = practice.queue;
  const body = document.getElementById('practiceBody');
  const empty = document.getElementById('practiceEmpty');
  if (!qs.length){
    body.classList.add('hidden'); empty.classList.remove('hidden');
    empty.textContent = practice.mode === 'wrong'
      ? '当前筛选下没有错题，去挑战新题目吧。'
      : '当前筛选条件下没有题目，请调整筛选条件。';
    return;
  }
  body.classList.remove('hidden'); empty.classList.add('hidden');
  if (practice.idx >= qs.length) practice.idx = qs.length - 1;
  const q = qs[practice.idx];
  document.getElementById('posInfo').textContent = `第 ${practice.idx+1} / ${qs.length} 题`;
  const tag = document.getElementById('typeTag');
  tag.textContent = `${q.type} · 第 ${q.num} 题`;
  tag.className = 'tag ' + (TYPE_CLS[q.type] || '');
  document.getElementById('wrongTag').style.display = practice.mode === 'wrong' ? '' : 'none';
  document.getElementById('shuffleTag').style.display =
    (state.settings.shuffle && isChoice(q)) ? '' : 'none';
  const r = rec(q.id);
  document.getElementById('qStats').textContent = r.attempts
    ? `累计作答 ${r.attempts} 次 · 答对 ${r.correct} 次` : '';
  document.getElementById('qText').innerHTML = renderQuestionText(q);
  renderOptions(q);
  renderAnswerArea(q);
  document.getElementById('feedback').classList.add('hidden');
  if (practice.answered || practice.revealed) renderFeedback(q);
  renderDots();
}
function renderOptions(q){
  const ul = document.getElementById('qOptions');
  if (!isChoice(q) && q.type !== '判断题'){ ul.innerHTML = ''; return; }
  const opts = optionView(q);
  ul.innerHTML = opts.map(o => {
    const isRight = q.type === '判断题' ? q.answer === o.orig : q.answer.includes(o.orig);
    let cls = practice.selected.has(o.l) ? 'sel' : '';
    if (practice.answered){
      if (isRight) cls = 'right';
      else if (practice.selected.has(o.l)) cls = 'wrong-sel';
    }
    return `<li class="option ${cls}" data-l="${esc(o.l)}"><span class="letter">${esc(o.l)}</span><span class="txt">${esc(o.t)}</span></li>`;
  }).join('');
  ul.querySelectorAll('.option').forEach(li => {
    li.addEventListener('click', () => {
      if (practice.answered) return;
      const l = li.dataset.l;
      if (q.type === '多选题'){
        practice.selected.has(l) ? practice.selected.delete(l) : practice.selected.add(l);
      } else {
        practice.selected = new Set([l]);
      }
      renderOptions(q);
    });
  });
}
function renderAnswerArea(q){
  const box = document.getElementById('qAnswerArea');
  const actions = document.getElementById('answerActions');
  if (q.type === '填空题'){
    box.innerHTML = practice.answered
      ? `<div class="hint">你的答案：${esc((practice.result && practice.result.fill) || '')}</div>`
      : `<input type="text" id="fillInput" placeholder="请输入答案（忽略空格和标点）" style="width:100%;max-width:520px;">`;
    actions.innerHTML = practice.answered
      ? `<button class="btn ok" id="btnNext2">下一题 →</button><button class="btn" id="btnPrev2">← 上一题</button>`
      : `<button class="btn primary" id="btnSubmit">提交答案</button><button class="btn ghost" id="btnGiveUp">不会，看答案</button>`;
  } else if (q.type === '简答题' || q.type === '问答题'){
    box.innerHTML = practice.revealed
      ? `<div class="hint">你的作答：${esc((practice.result && practice.result.essay) || '（未填写）')}</div>`
      : `<textarea id="essayInput" placeholder="在这里写出你的答案要点（也可以只在心里作答后直接看参考答案）"></textarea>`;
    actions.innerHTML = practice.revealed
      ? (practice.answered
          ? `<button class="btn ok" id="btnNext2">下一题 →</button><button class="btn" id="btnPrev2">← 上一题</button>`
          : `<span style="font-size:14px;color:var(--muted);align-self:center;">对照参考答案，给自己评一下：</span>
             <button class="btn ok" id="btnSelfOk">✅ 答对了</button>
             <button class="btn danger" id="btnSelfBad">❌ 没答全 / 不会</button>`)
      : `<button class="btn primary" id="btnReveal">查看参考答案</button>`;
  } else {
    box.innerHTML = '';
    actions.innerHTML = practice.answered
      ? `<button class="btn ok" id="btnNext2">下一题 →</button><button class="btn" id="btnPrev2">← 上一题</button>`
      : `<button class="btn primary" id="btnSubmit">提交答案</button>`;
  }
  wireActionButtons(q);
}

function wireActionButtons(q){
  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.addEventListener('click', fn); };
  on('btnSubmit', () => submitAnswer());
  on('btnGiveUp', () => giveUp(q));
  on('btnReveal', () => revealAnswer());
  on('btnSelfOk', () => selfAssess(q, true));
  on('btnSelfBad', () => selfAssess(q, false));
  on('btnNext2', nextQ);
  on('btnPrev2', prevQ);
  const fi = document.getElementById('fillInput');
  if (fi) fi.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); submitAnswer(); } });
}
function recordResult(q, ok){
  const r = rec(q.id);
  r.attempts++;
  ok ? r.correct++ : r.wrong++;
  r.last = ok ? 'correct' : 'wrong';
  saveState();
}
function submitAnswer(){
  const q = practice.queue[practice.idx];
  if (!q) return;
  if (q.type === '填空题'){
    const inp = document.getElementById('fillInput');
    const val = inp ? inp.value : '';
    if (!val.trim()){ showToast('请先输入答案'); return; }
    const ok = fillCorrect(val, q.answer);
    recordResult(q, ok);
    practice.result = { fill: val, isCorrect: ok };
    practice.answered = true;
    renderPractice(); renderHeader();
    return;
  }
  if (!practice.selected.size){ showToast('请先选择答案再提交'); return; }
  const selDisplay = [...practice.selected].sort().join('');
  const selOriginal = toOriginalAnswer(q, practice.selected);
  const ok = selOriginal === q.answer;
  recordResult(q, ok);
  practice.result = { selDisplay, selOriginal, isCorrect: ok };
  practice.answered = true;
  renderPractice(); renderHeader();
}
function giveUp(q){
  recordResult(q, false);
  practice.result = { fill: '', isCorrect: false };
  practice.answered = true;
  renderPractice(); renderHeader();
}
function revealAnswer(){
  const ta = document.getElementById('essayInput');
  practice.result = { essay: ta ? ta.value.trim() : '' };
  practice.revealed = true;
  renderPractice();
}
function selfAssess(q, ok){
  const r = rec(q.id);
  r.attempts++;
  ok ? r.correct++ : r.wrong++;
  r.last = ok ? 'correct' : 'wrong';
  if (practice.result && practice.result.essay) r.essay = practice.result.essay;
  saveState();
  practice.result = Object.assign({}, practice.result || {}, { isCorrect: ok });
  practice.answered = true;
  renderPractice(); renderHeader();
}
function fullStatement(q){
  if (q.type === '判断题') return esc(q.text);
  const blanks = (q.text.match(/（）/g) || []).length;
  if (blanks !== 1) return null;
  const fill = ansTexts(q).join('；');
  return esc(q.text).replace('（）', `<b style="color:var(--primary)">${esc(fill)}</b>`);
}
/* 题干渲染：填空题的 __ 显示为填空线 */
function renderQuestionText(q){
  let html = esc(q.text);
  html = html.replace(/_{2,}/g, '<span class="blank-line"></span>');
  html = html.replace(/（\s*）/g, '<span class="blank">（　）</span>');
  return html;
}
function renderFeedback(q){
  const fb = document.getElementById('feedback');
  const r = state.records[q.id] || {attempts:0, correct:0, note:''};
  const noteHtml = `<div class="row"><span class="k">笔记</span>
      <textarea id="noteBox" placeholder="记录自己的理解和易错点（自动保存）">${esc(r.note || '')}</textarea></div>`;
  const srcHtml = `<div class="row"><span class="k">依据</span><span>${q.source ? esc(q.source) : '未标注'}</span></div>`;
  const statHtml = `<div class="row" style="color:var(--muted);font-size:12px;">本题累计作答 ${r.attempts} 次，答对 ${r.correct} 次${isWrong(q.id) ? ' · 已在错题本' : ''}</div>`;

  if (q.type === '简答题' || q.type === '问答题'){
    const ok = !!(practice.result && practice.result.isCorrect);
    fb.className = 'feedback ' + (practice.answered ? (ok ? 'good' : 'bad') : 'neutral');
    fb.innerHTML = `
      <div class="verdict ${practice.answered ? (ok ? 'good' : 'bad') : ''}">
        ${practice.answered ? (ok ? '✅ 已掌握' : '❌ 未掌握，已收入错题本') : '📖 参考答案（<span style="color:#dc2626">红色</span>为评分关键词）'}
      </div>
      <div class="analysis">
        <div class="row"><span class="k">参考答案</span><span class="answer-body">${q.answerHtml || esc(q.answer)}</span></div>
        ${q.criterion ? `<div class="row"><span class="k">评分标准</span><span class="criterion">${esc(q.criterion)}</span></div>` : ''}
        ${srcHtml}
        ${noteHtml}
        ${practice.answered ? statHtml : ''}
      </div>`;
  } else if (q.type === '填空题'){
    const ok = !!(practice.result && practice.result.isCorrect);
    fb.className = 'feedback ' + (ok ? 'good' : 'bad');
    fb.innerHTML = `
      <div class="verdict ${ok ? 'good' : 'bad'}">${ok ? '✅ 回答正确' : '❌ 回答错误'}</div>
      <div class="analysis">
        <div class="row"><span class="k">参考答案</span><span class="ans-letters">${esc(q.answer)}</span></div>
        ${practice.result && practice.result.fill ? `<div class="row"><span class="k">你的答案</span><span style="color:${ok?'var(--ok)':'var(--bad)'}">${esc(practice.result.fill)}</span></div>` : ''}
        ${srcHtml}
        ${noteHtml}
        ${statHtml}
      </div>`;
  } else {
    const dispAns = displayAnswerLetters(q);
    const ansLetters = q.type === '判断题' ? q.answer : [...dispAns].join('、');
    const ansFull = q.type === '判断题'
      ? (q.answer === '正确' ? '该表述正确' : '该表述错误')
      : optionTextsByLetters(q, dispAns).join('；');
    const myPick = practice.result && practice.result.selDisplay
      ? (q.type === '判断题' ? practice.result.selDisplay : optionTextsByLetters(q, practice.result.selDisplay).join('；'))
      : '';
    const stmt = fullStatement(q);
    const ok = !!(practice.result && practice.result.isCorrect);
    fb.className = 'feedback ' + (ok ? 'good' : 'bad');
    fb.innerHTML = `
      <div class="verdict ${ok ? 'good' : 'bad'}">
        ${ok ? '✅ 回答正确' : '❌ 回答错误' + (q.type === '判断题' ? `（正确答案：<b>${esc(ansLetters)}</b>）` : `（正确答案：<b>${esc(ansLetters)}</b>）`)}
      </div>
      <div class="analysis">
        ${q.type !== '判断题' ? `<div class="row"><span class="k">正确答案</span><span class="ans-letters">${esc(ansLetters)}</span>　<span>${esc(ansFull)}</span></div>` : ''}
        ${!ok && myPick ? `<div class="row"><span class="k">你的选择</span><span style="color:var(--bad)">${esc(myPick)}</span></div>` : ''}
        ${stmt ? `<div class="row"><span class="k">完整表述</span><span>${stmt}</span></div>` : ''}
        ${srcHtml}
        ${noteHtml}
        ${statHtml}
      </div>`;
  }
  const note = document.getElementById('noteBox');
  if (note) note.addEventListener('input', () => { rec(q.id).note = note.value; saveState(); });
}
function renderDots(){
  const box = document.getElementById('qDots');
  box.innerHTML = practice.queue.map((q, i) => {
    const r = state.records[q.id];
    let cls = '';
    if (r && r.attempts) cls = r.last === 'correct' ? 'done' : 'err';
    return `<div class="dot ${cls} ${i === practice.idx ? 'cur' : ''} ${practice.queue.length > 40 ? 'dim' : ''}" data-i="${i}">${i+1}</div>`;
  }).join('');
  box.querySelectorAll('.dot').forEach(d => d.addEventListener('click', () => {
    practice.idx = +d.dataset.i;
    practice.answered = false; practice.revealed = false;
    practice.selected = new Set(); practice.result = null;
    renderPractice();
  }));
}
function nextQ(){
  if (practice.idx < practice.queue.length - 1){ practice.idx++; }
  else {
    if (practice.mode === 'wrong'){ showToast('已练完一遍，错题本已按最新错误率重新排序'); setView('wrong'); return; }
    showToast('已经是最后一题了');
  }
  practice.answered = false; practice.revealed = false;
  practice.selected = new Set(); practice.result = null;
  renderPractice();
}
function prevQ(){
  if (practice.idx > 0){
    practice.idx--;
    practice.answered = false; practice.revealed = false;
    practice.selected = new Set(); practice.result = null;
    renderPractice();
  }
}

/* ---------- 题目浏览 ---------- */
function initBrowse(){
  document.getElementById('bSec').innerHTML = `<option value="全部">全部题型</option>` +
    TYPES.map(t => `<option value="${t}">${t}（${QBANK.filter(q => q.type === t).length}）</option>`).join('');
  document.getElementById('bAns').innerHTML =
    `<button data-ba="1" class="on">显示答案</button><button data-ba="0">隐藏答案</button>`;

  document.getElementById('bAns').addEventListener('click', e => {
    const b = e.target.closest('button[data-ba]'); if(!b) return;
    browse.showAns = b.dataset.ba === '1';
    document.querySelectorAll('#bAns button').forEach(x => x.classList.toggle('on', x === b));
    renderBrowse();
  });
  document.getElementById('bSearch').addEventListener('input', e => {
    browse.q = e.target.value.trim(); browse.shown = 50; renderBrowse();
  });
  document.getElementById('bMore').addEventListener('click', () => { browse.shown += 50; renderBrowse(); });

    if (b) startPracticeAt(+b.dataset.bq);

}
function browseQuestions(){
  const kw = browse.q;
  return QBANK.filter(q =>
    (browse.sec === '全部' || q.sec === browse.sec) &&
    (!kw || q.text.indexOf(kw) >= 0 ||
      (q.options || []).some(o => o.t.indexOf(kw) >= 0) ||
      (q.answer && q.answer.indexOf(kw) >= 0) ||
      (q.source && q.source.indexOf(kw) >= 0))
  );
}
function answerHtmlOf(q){
  if (q.type === '简答题' || q.type === '问答题') return q.answerHtml || esc(q.answer);
  if (q.type === '填空题') return `<b>${esc(q.answer)}</b>`;
  if (q.type === '判断题') return `<b>${esc(q.answer)}</b>`;
  return `<b>${esc(q.answer)}</b>　${esc(ansTexts(q).join('；'))}`;
}
function renderBrowse(){
  const all = browseQuestions();
  const list = document.getElementById('browseList');
  const shown = all.slice(0, browse.shown);
  document.getElementById('browseCount').textContent =
    `共 ${all.length} 道题` + (all.length > shown.length ? `，已显示前 ${shown.length} 道` : '');
  if (!all.length){
    list.innerHTML = `<div class="empty-tip">没有符合条件的题目，换个题型或关键字试试。</div>`;
    document.getElementById('bMore').classList.add('hidden');
    return;
  }
  list.innerHTML = shown.map(q => {
    const r = state.records[q.id];
    const status = (!r || !r.attempts)
      ? '<span class="tag">未做</span>'
      : (r.last === 'correct' ? '<span class="tag">上次通过</span>' : '<span class="tag wrong">上次未通过</span>');
    let optsHtml = '';
    if (isChoice(q) || q.type === '判断题'){
      const opts = q.type === '判断题'
        ? [{l:'正确', t:'正确', orig:'正确'}, {l:'错误', t:'错误', orig:'错误'}]
        : q.options.map(o => ({l:o.l, t:o.t, orig:o.l}));
      optsHtml = '<ul class="options readonly" style="margin-top:8px;">' + opts.map(o => {
        const isRight = q.type === '判断题' ? q.answer === o.orig : q.answer.includes(o.orig);
        const cls = (browse.showAns && isRight) ? 'option right' : 'option';
        return `<li class="${cls}" style="cursor:default;"><span class="letter">${esc(o.l)}</span><span class="txt">${esc(o.t)}</span></li>`;
      }).join('') + '</ul>';
    }
    return `<div class="wrong-item">
      <div class="meta" style="margin:0 0 6px;">
        <span>${q.type} · 第 ${q.num} 题</span>${status}
        ${r && r.wrong ? `<span style="color:var(--bad)">错误率 ${Math.round(wrongRate(q.id)*100)}%</span>` : ''}
      </div>
      <div class="q-text">${renderQuestionText(q)}</div>
      ${optsHtml}
      ${browse.showAns ? `<div class="meta" style="display:block;margin-top:8px;">
          <div><span class="k" style="color:var(--muted)">参考答案：</span><span class="answer-body">${answerHtmlOf(q)}</span></div>
          ${q.criterion ? `<div class="criterion" style="margin-top:4px;">评分标准：${esc(q.criterion)}</div>` : ''}
          ${q.source ? `<div style="margin-top:4px;">依据：${esc(q.source)}</div>` : ''}
        </div>` : ''}
      <div class="ops"><button class="btn small primary" data-bq="${q.id}">去练习本题</button></div>
    </div>`;
  }).join('');
  document.getElementById('bMore').classList.toggle('hidden', all.length <= shown.length);
}
function syncBrowseUI(){
  const sel = document.getElementById('bSec');
  if (sel) sel.value = browse.sec;
  document.querySelectorAll('#bAns button').forEach(b => b.classList.toggle('on', (b.dataset.ba === '1') === browse.showAns));
  const s = document.getElementById('bSearch');
  if (s) s.value = browse.q;
}
function syncFilterUI(){
  const sel = document.getElementById('fSec');
  if (sel) sel.value = practice.sec;
  document.querySelectorAll('#fMode button').forEach(b => b.classList.toggle('on', b.dataset.m === practice.mode));
  document.querySelectorAll('#fShuffle button').forEach(b => b.classList.toggle('on', (b.dataset.s === '1') === !!state.settings.shuffle));
}
function startPracticeAt(id){
  const q = QBANK.find(x => x.id === id);
  if (!q) return;
  practice.mode = 'seq';
  practice.sec = q.type;
  syncFilterUI();
  buildQueue();
  practice.idx = practice.queue.findIndex(x => x.id === id);
  if (practice.idx < 0) practice.idx = 0;
  practice.answered = false; practice.revealed = false;
  practice.selected = new Set(); practice.result = null;
  setView('practice');
}

/* ---------- 全局事件 ---------- */
document.getElementById('btnDash').addEventListener('click', () => setView('dash'));
document.getElementById('btnPractice').addEventListener('click', () => setView('practice'));
document.getElementById('btnBrowse').addEventListener('click', () => { syncBrowseUI(); setView('browse'); });
document.getElementById('btnWrong').addEventListener('click', () => setView('wrong'));
document.getElementById('navToggle').addEventListener('click', () => {
  document.getElementById('navActions').classList.toggle('open');
});
document.getElementById('navActions').addEventListener('click', e => {
  if (e.target.closest('button')) document.getElementById('navActions').classList.remove('open');
});
document.getElementById('btnReset').addEventListener('click', () => {
  if (confirm('确定要清空所有答题记录、错题本和笔记吗？此操作不可恢复。')){
    try { localStorage.removeItem(KEY); } catch(e){ warnStorage(); }
    state = {records:{}, excluded:{}, settings: state.settings};
    saveState(); renderHeader(); renderDash();
    showToast('进度已重置');
  }
});
document.getElementById('sectionBars').addEventListener('click', e => {
  const b = e.target.closest('[data-browse]');
  if (!b) return;
  browse.sec = b.dataset.browse; browse.q = ''; browse.shown = 50;
  syncBrowseUI(); setView('browse');
});
document.getElementById('dashStartAll').addEventListener('click', () => {
  practice.mode = 'seq'; practice.sec = '全部';
  syncFilterUI(); buildQueue(); setView('practice');
});
document.getElementById('dashStartWrong').addEventListener('click', () => {
  practice.mode = 'wrong'; practice.sec = '全部';
  syncFilterUI(); buildQueue(); setView('practice');
});
document.getElementById('wrongRetrain').addEventListener('click', () => {
  practice.mode = 'wrong'; practice.sec = '全部';
  syncFilterUI(); buildQueue(); setView('practice');
});
document.getElementById('wrongEmpty').addEventListener('click', () => {
  if (!confirm('将把所有题目标记为“已移出错题本”（答题记录保留）。确定继续？')) return;
  QBANK.filter(q => isWrong(q.id)).forEach(q => { state.excluded[q.id] = true; });
  saveState(); renderWrong(); renderHeader();
});
document.getElementById('dashExport').addEventListener('click', exportProgress);
document.getElementById('dashImport').addEventListener('click', () => document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change', importProgress);
document.getElementById('wrongList').addEventListener('click', e => {
  const go = e.target.closest('[data-go]');
  const out = e.target.closest('[data-out]');
  if (go){
    const id = +go.dataset.go;
    const q = QBANK.find(x => x.id === id);
    practice.mode = 'wrong'; practice.sec = q.type;
    syncFilterUI(); buildQueue();
    practice.idx = practice.queue.findIndex(x => x.id === id);
    if (practice.idx < 0) practice.idx = 0;
    practice.answered = false; practice.revealed = false;
    practice.selected = new Set(); practice.result = null;
    setView('practice');
  }
  if (out){
    state.excluded[+out.dataset.out] = true;
    saveState(); renderWrong(); renderHeader();
    showToast('已移出错题本');
  }
});
document.addEventListener('keydown', e => {
  if (view !== 'practice' || !practice.queue.length) return;
  if (e.key === 'Enter' && !practice.answered && !document.getElementById('essayInput')){ e.preventDefault(); submitAnswer(); }
  if (e.key === 'ArrowRight' && practice.answered) nextQ();
  if (e.key === 'ArrowLeft' && practice.answered) prevQ();
});
function exportProgress(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '运维题库学习进度_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('进度已导出');
}
function importProgress(e){
  const f = e.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const s = JSON.parse(reader.result);
      if (!s || typeof s !== 'object' || !s.records) throw new Error('bad');
      if (!confirm('导入将覆盖当前进度，确定继续？')) return;
      state = {records: s.records || {}, excluded: s.excluded || {}, settings: s.settings || state.settings};
      saveState(); syncFilterUI(); renderHeader(); renderDash();
      showToast('进度已导入');
    } catch(err){ showToast('文件格式不正确，导入失败'); }
  };
  reader.readAsText(f);
  e.target.value = '';
}

/* ---------- 启动 ---------- */
initFilters();
initBrowse();
syncFilterUI();
syncBrowseUI();
renderFilterSummary();
applyFiltersVisibility();
renderHeader();
renderDash();
if (!storageOk) warnStorage();
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>
</body>
</html>
