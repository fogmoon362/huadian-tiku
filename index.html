<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1e3a8a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="运维题库">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>运维部10月业务知识考试题</title>
<style>
  :root {
    --primary: #2563eb;
    --primary-soft: #dbeafe;
    --ok: #16a34a;
    --ok-soft: #dcfce7;
    --bad: #dc2626;
    --bad-soft: #fee2e2;
    --warn: #d97706;
    --warn-soft: #fef3c7;
    --bg: #f3f4f6;
    --card: #ffffff;
    --border: #e5e7eb;
    --text: #1f2937;
    --muted: #6b7280;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
  }
  header {
    background: linear-gradient(120deg, #1e3a8a, #2563eb);
    color: #fff; padding: 14px 22px; position: sticky; top: 0; z-index: 20;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
  }
  .header-inner { max-width: 1060px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
  .brand { font-size: 18px; font-weight: 700; letter-spacing: .5px; }
  .brand small { display: block; font-weight: 400; font-size: 12px; opacity: .85; margin-top: 2px; }
  .spacer { flex: 1; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .nav-toggle { display: none; }
  .chip {
    background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.25);
    border-radius: 999px; padding: 4px 12px; font-size: 13px; white-space: nowrap;
  }
  .chip b { font-size: 15px; margin-left: 2px; }
  .btn {
    border: none; border-radius: 8px; padding: 8px 16px; font-size: 14px; cursor: pointer;
    background: #fff; color: var(--text); transition: filter .15s, transform .05s;
  }
  .btn:hover { filter: brightness(.96); }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--primary); color: #fff; }
  .btn.ok { background: var(--ok); color: #fff; }
  .btn.danger { background: var(--bad); color: #fff; }
  .btn.ghost { background: transparent; color: var(--primary); border: 1px solid var(--primary); }
  .btn.small { padding: 4px 10px; font-size: 13px; border-radius: 6px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  main { max-width: 1060px; margin: 20px auto 60px; padding: 0 16px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.05);
  }
  .section-title { font-size: 17px; font-weight: 700; margin-bottom: 14px; }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; text-align: center; }
  .stat .num { font-size: 26px; font-weight: 800; color: var(--primary); }
  .stat .num.ok { color: var(--ok); }
  .stat .num.bad { color: var(--bad); }
  .stat .label { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .bar-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .bar-row .name { width: 150px; flex-shrink: 0; font-size: 14px; }
  .bar-row .name small { color: var(--muted); display: block; font-size: 12px; }
  .bar { flex: 1; height: 10px; background: #eef0f3; border-radius: 999px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: linear-gradient(90deg, #3b82f6, #2563eb); border-radius: 999px; transition: width .3s; }
  .bar > i.ok { background: linear-gradient(90deg, #22c55e, #16a34a); }
  .bar > i.partial { background: linear-gradient(90deg, #f59e0b, #d97706); }
  .bar-row .pct { width: 56px; text-align: right; font-size: 13px; color: var(--muted); }
  .filter-bar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin-bottom: 16px; }
  .filter-bar label { font-size: 13px; color: var(--muted); margin-right: 6px; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg button {
    border: none; background: #fff; padding: 7px 14px; font-size: 13px; cursor: pointer; color: var(--text);
    border-right: 1px solid var(--border);
  }
  .seg button:last-child { border-right: none; }
  .seg button.on { background: var(--primary); color: #fff; }
  select, input[type=search], input[type=text], textarea {
    padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; background: #fff;
    font-family: inherit;
  }
  textarea { width: 100%; min-height: 90px; resize: vertical; line-height: 1.7; }
  .practice-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .practice-bar .summary { flex: 1; font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .practice-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 12px; }
  .practice-head .pos { font-size: 15px; color: var(--muted); }
  .tag { font-size: 12px; padding: 2px 10px; border-radius: 999px; background: var(--primary-soft); color: var(--primary); font-weight: 600; }
  .tag.single { background: #e0f2fe; color: #0369a1; }
  .tag.multi { background: #fce7f3; color: #be185d; }
  .tag.judge { background: #fef3c7; color: var(--warn); }
  .tag.fill { background: #ede9fe; color: #6d28d9; }
  .tag.essay { background: #ffedd5; color: #c2410c; }
  .tag.wrong { background: var(--bad-soft); color: var(--bad); }
  .question-text { font-size: 16px; margin: 6px 0 16px; white-space: pre-wrap; }
  .blank { color: var(--primary); font-weight: 700; }
  .blank-line {
    display: inline-block; min-width: 96px; height: 1.05em;
    border-bottom: 2px solid var(--primary); vertical-align: -0.12em;
    margin: 0 6px;
  }
  .options { list-style: none; }
  .option {
    display: flex; gap: 10px; align-items: flex-start; border: 1.5px solid var(--border);
    border-radius: 10px; padding: 11px 14px; margin-bottom: 10px; cursor: pointer; background: #fff;
    transition: border-color .12s, background .12s;
  }
  .option:hover { border-color: #93c5fd; }
  .option.sel { border-color: var(--primary); background: var(--primary-soft); }
  .option.right { border-color: var(--ok); background: var(--ok-soft); }
  .option.wrong-sel { border-color: var(--bad); background: var(--bad-soft); }
  .option .letter {
    width: 26px; height: 26px; flex-shrink: 0; border-radius: 50%; background: #eef0f3; color: var(--text);
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px;
  }
  .option.sel .letter { background: var(--primary); color: #fff; }
  .option.right .letter { background: var(--ok); color: #fff; }
  .option.wrong-sel .letter { background: var(--bad); color: #fff; }
  .option .txt { flex: 1; padding-top: 2px; }
  .options.readonly .option { cursor: default; }
  .options.readonly .option:hover { border-color: var(--border); }
  .actions-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; align-items: center; }
  .feedback { margin-top: 16px; border-radius: var(--radius); padding: 16px; }
  .feedback.good { background: var(--ok-soft); border: 1px solid #86efac; }
  .feedback.bad { background: var(--bad-soft); border: 1px solid #fca5a5; }
  .feedback.neutral { background: #eff6ff; border: 1px solid #bfdbfe; }
  .feedback .verdict { font-size: 16px; font-weight: 800; margin-bottom: 8px; }
  .feedback .verdict.good { color: var(--ok); }
  .feedback .verdict.bad { color: var(--bad); }
  .analysis { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-top: 12px; }
  .analysis .row { margin-bottom: 10px; font-size: 14px; }
  .analysis .row:last-child { margin-bottom: 0; }
  .analysis .k { color: var(--muted); display: inline-block; min-width: 62px; vertical-align: top; }
  .analysis .ans-letters { font-weight: 800; color: var(--primary); }
  .answer-body { white-space: pre-wrap; word-break: break-word; }
  .kw { color: #dc2626; font-weight: 700; }
  .criterion { color: var(--warn); font-size: 13px; }
  .analysis textarea { min-height: 64px; }
  .dots { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
  .dot {
    width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; background: #fff;
  }
  .dot.done { background: var(--ok-soft); border-color: #86efac; color: var(--ok); }
  .dot.err { background: var(--bad-soft); border-color: #fca5a5; color: var(--bad); }
  .dot.cur { outline: 2px solid var(--primary); }
  .dot.dim { opacity: .45; }
  .wrong-item { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; background: #fff; }
  .wrong-item .q-text { font-size: 14px; }
  .wrong-item .meta { font-size: 12px; color: var(--muted); margin-top: 4px; display: flex; gap: 10px; flex-wrap: wrap; }
  .wrong-item .ops { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }
  .empty-tip { text-align: center; color: var(--muted); padding: 40px 10px; font-size: 15px; }
  .toast {
    position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%) translateY(20px);
    background: #111827; color: #fff; padding: 10px 20px; border-radius: 999px; font-size: 14px;
    opacity: 0; pointer-events: none; transition: all .25s; z-index: 50;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .foot-actions { margin-top: 14px; display: flex; gap: 10px; flex-wrap: wrap; }
  .hidden { display: none !important; }
  .hint { font-size: 13px; color: var(--muted); margin-top: 6px; }
  @media (max-width: 640px) {
    header { padding: 8px 12px; }
    .header-inner { gap: 6px; }
    .brand { font-size: 15px; }
    .brand small { display: none; }
    .chips { display: none; }
    .actions { display: none; width: 100%; gap: 6px; }
    .actions.open { display: flex; }
    .actions .btn { padding: 6px 12px; font-size: 13px; }
    .nav-toggle { display: inline-flex; padding: 6px 12px; font-size: 13px; }
    main { margin: 10px auto 40px; padding: 0 10px; }
    .card { padding: 12px; }
    .filter-bar { gap: 8px 14px; margin-bottom: 10px; }
    .filter-bar label { font-size: 12px; margin-right: 4px; }
    .seg button { padding: 6px 11px; font-size: 12px; }
    .practice-head { gap: 8px; margin-bottom: 8px; }
    .question-text { font-size: 15px; margin: 4px 0 10px; }
    .option { padding: 9px 11px; margin-bottom: 8px; gap: 8px; }
    .dot { width: 26px; height: 26px; font-size: 11px; }
    .dots { gap: 4px; margin-top: 10px; }
    .bar-row .name { width: 110px; }
  }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="brand">运维部10月业务知识考试题
      <small>592 题 · 答题进度 · 错题收集 · 答案解析</small>
    </div>
    <div class="spacer"></div>
    <div class="chips" id="headChips"></div>
    <div class="actions" id="navActions">
      <button class="btn" id="btnDash">首页</button>
      <button class="btn primary" id="btnPractice">开始练习</button>
      <button class="btn" id="btnBrowse">题目浏览</button>
      <button class="btn" id="btnWrong">错题本</button>
      <button class="btn danger" id="btnReset">重置进度</button>
    </div>
    <button class="btn nav-toggle" id="navToggle">☰ 菜单</button>
  </div>
</header>

<main>
  <section id="viewDash">
    <div class="card">
      <div class="section-title">学习进度总览</div>
      <div class="stat-grid" id="statGrid"></div>
      <div id="sectionBars"></div>
      <div class="foot-actions">
        <button class="btn primary" id="dashStartAll">开始练习（全部）</button>
        <button class="btn" id="dashStartWrong">只练错题</button>
        <button class="btn ghost" id="dashExport">导出进度</button>
        <button class="btn ghost" id="dashImport">导入进度</button>
        <input type="file" id="importFile" accept="application/json" class="hidden">
      </div>
    </div>
    <div class="card" style="margin-top:16px;">
      <div class="section-title">各题型说明</div>
      <ul style="padding-left:20px;font-size:14px;line-height:2;">
        <li><b>单选 / 多选 / 判断</b>：点选项作答，提交后自动判分。</li>
        <li><b>填空题</b>：输入答案后提交，系统自动比对（忽略空格与标点）。</li>
        <li><b>简答 / 问答</b>：先在输入框写下你的答案（也可只在心里作答），点“查看参考答案”后对照，
          参考答案中的<b style="color:#dc2626">红色关键词</b>即为评分要点；看完自己做“答对了 / 没答全”的自评。</li>
      </ul>
    </div>
  </section>

  <section id="viewPractice" class="hidden">
    <div class="card">
      <div class="practice-bar">
        <span class="summary" id="filterSummary"></span>
        <button class="btn small" id="btnToggleFilters">筛选设置 ▾</button>
      </div>
      <div class="filter-bar hidden" id="practiceFilters">
        <div>
          <label>题型</label>
          <select id="fSec"></select>
        </div>
        <div>
          <label>模式</label>
          <span class="seg" id="fMode"></span>
        </div>
        <div>
          <label>选项顺序</label>
          <span class="seg" id="fShuffle"></span>
        </div>
        <button class="btn primary" id="btnBegin">开始 / 重新开始</button>
      </div>
      <div id="practiceBody" class="hidden">
        <div class="practice-head">
          <span class="pos" id="posInfo"></span>
          <span class="tag" id="typeTag"></span>
          <span class="tag wrong" id="wrongTag" style="display:none">错题</span>
          <span class="tag" id="shuffleTag" style="display:none">选项已乱序</span>
          <span class="spacer"></span>
          <span style="font-size:13px;color:var(--muted)" id="qStats"></span>
        </div>
        <div class="question-text" id="qText"></div>
        <ul class="options" id="qOptions"></ul>
        <div id="qAnswerArea"></div>
        <div class="actions-row" id="answerActions"></div>
        <div id="feedback" class="hidden"></div>
        <div class="dots" id="qDots"></div>
      </div>
      <div id="practiceEmpty" class="empty-tip hidden"></div>
    </div>
  </section>

  <section id="viewWrong" class="hidden">
    <div class="card">
      <div class="section-title">错题本</div>
      <div class="stat-grid" id="wrongStats"></div>
      <div id="wrongList"></div>
      <div class="foot-actions">
        <button class="btn primary" id="wrongRetrain">重练全部错题</button>
        <button class="btn ghost" id="wrongEmpty">清空错题本</button>
      </div>
    </div>
  </section>

  <section id="viewBrowse" class="hidden">
    <div class="card">
      <div class="section-title">题目浏览 · 查看各题型题目与答案</div>
      <div class="filter-bar">
        <div>
          <label>题型</label>
          <select id="bSec"></select>
        </div>
        <div>
          <label>答案</label>
          <span class="seg" id="bAns"></span>
        </div>
        <div>
          <input id="bSearch" type="search" placeholder="搜索题干 / 选项 / 答案关键字" style="min-width:220px;">
        </div>
      </div>
      <div id="browseCount" style="font-size:13px;color:var(--muted);margin-bottom:10px;"></div>
      <div id="browseList"></div>
      <div class="foot-actions">
        <button class="btn primary hidden" id="bMore">显示更多</button>
        <button class="btn ghost" id="bBackTop">回到顶部</button>
      </div>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>

"跳闸线圈辅助触点"}, {"l": "C", "t": "机械闭锁元器件"}, {"l": "D", "t": "互锁元件"}], "answer": "AB", "source": "依据 DL/T2533-2022《发电厂继电保护和安全自动装置现场工作安全措施规范》"}, {"id": 282, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 1, "text": "统一调度，分级管理是电网调度最重要的一条原则。", "options": [], "answer": "正确", "source": "依据 DL/T5003-2017《电力系统调度自动化设计规程》第 1.0.3条的规定"}, {"id": 283, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 2, "text": "不允许用电缆中的备用芯两端接地的方法作为微机型和集成电路型保护抗干扰措施。", "options": [], "answer": "正确", "source": ""}, {"id": 284, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 3, "text": "检查光伏组件与支架的卡件固定是否牢固、卡件有无脱落，检查光伏卡件是否有锈蚀。支架有松动现象时应紧固支架，卡件锈蚀时应更换卡件，检修项目宜每年开展一次。", "options": [], "answer": "错误", "source": "解析：【依据 GB/T 36567-2018《光伏组件检修规程》第 5.3.2 条规定：检修项目宜每 2 年开展一次"}, {"id": 285, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 4, "text": "管理信息大区可单套配置远动网关，实现与其他管理系统的信息传输。", "options": [], "answer": "正确", "source": "依据 DL/T5003-2017《电力系统调度自动化设计规程》第 5.2.2条的规定"}, {"id": 286, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 5, "text": "对于小型光伏电站，应具备快速监测孤岛且立即断开与电网连接的能力。", "options": [], "answer": "正确", "source": "依据 Q/GDW 617-2011《光伏电站接入电网技术规定》第 8.2.1条规定"}, {"id": 287, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 6, "text": "组串式逆变器集中式布置，电网响应和支撑性稍差。", "options": [], "answer": "错误", "source": "解析：【依据《光伏发电设备维护与检修》华电集团有限公司 2023 版 第五章第三节规定：组串式逆变器分布式布置，电网响应和支撑性稍差"}, {"id": 288, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 7, "text": "变压器空载时无电流流过。", "options": [], "answer": "错误", "source": "解析：变压器空载时二次侧没有电流通过。"}, {"id": 289, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 8, "text": "光伏逆变器除具备低电压穿越能力外，机端电压原则上应具有 1 倍额定电压持续 500ms 的高电压穿越能力。", "options": [], "answer": "错误", "source": "解析：【依据《防止电力生产事故的二十五项重点要求（2023 版）》第5.2.2 条规定：光伏逆变器除具备低电压穿越能力外，机端电压原则上应具有 1.3 倍额定电压持续 500ms 的高电压穿越能力"}, {"id": 290, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 9, "text": "温度变化影响最大的是开路电压。", "options": [], "answer": "正确", "source": "依据《光伏发电技术及应用》华电集团有限公司 2023 版 第5.2.2 条规定"}, {"id": 291, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 10, "text": "当光伏电站设计为不可逆并网方式时，应配置逆向功率保护设备。当检测到逆向电流超过额定输出的 5%时，光伏电站应在 0.5s〜2s 内停止向电网线路送电。", "options": [], "answer": "正确", "source": "依据 Q/GDW 617-2011《光伏电站接入电网技术规定》第 8.3条规定"}, {"id": 292, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 11, "text": "配电柜中开关，主接触点不应有烧熔痕迹，灭弧罩不应烧黑和损坏，紧固各接线螺丝，清洁柜内灰尘。", "options": [], "answer": "正确", "source": ""}, {"id": 293, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 12, "text": "汇流箱检修工作结束后，必须检查汇流箱内部，看是否有其他东西落入，以免送电引起短路，确认无误后方可送电。", "options": [], "answer": "正确", "source": "依据 GB/T 29319-2012《光伏发电系统接入配电网技术规定》第 4.3.4 条规定"}, {"id": 294, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 13, "text": "辐射测量仪在低辐照度下的响应好于硅电池。", "options": [], "answer": "正确", "source": ""}, {"id": 295, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 14, "text": "双馈异步发电机在超同步运行状态时，发电机转速n大于同步转速n1时，转差率s\u003c0。", "options": [], "answer": "正确", "source": "同步发电机的运行方式有两种，即发电机和电动机。"}, {"id": 296, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 15, "text": "MPPT 控制器出现声音异常、焦味、冒烟等异常情况或可能遭受水灾时，应立即断开输入开关。", "options": [], "answer": "错误", "source": "解析：【依据 GB/T 35694-2017《光伏发电站安全规程》第 5.6.11 条规定：应立即断开输入、输出开关"}, {"id": 297, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 16, "text": "当光伏发电站送出线路为T 接方式时，光伏发电站升压站侧应配置线路保护装置。", "options": [], "answer": "正确", "source": "依据 GB/T 50865-2013《光伏发电接入配电网设计规范》第"}, {"id": 298, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 17, "text": "太阳跟踪系统钢制部件防腐应选用镀锌、防腐涂料涂装等防腐措施，其保证支架寿命20年以上。", "options": [], "answer": "错误", "source": "解析：【依据 GB/T 29320-2012《光伏电站太阳跟踪系统技术要求》第"}, {"id": 299, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 18, "text": "光伏发电站应建立光伏发电单元（含光伏组件、逆变器、单元升压变压器等）、光伏发电站汇集线路、光伏发电站控制系统模型及参数，用于光伏发电站接入电力系统的规划设计及调度运行。", "options": [], "answer": "正确", "source": "依据 GB/T 19964-2012《光伏发电站接入电力系统技术规定》第 11.1 条规定"}, {"id": 300, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 19, "text": "在保护装置检验完成投入运行前应拆除在检验时使用的试验设备、仪表及一切连接线，清扫现场，所有被拆动的或临时接入的连接线应全部恢复正常，所有信号装置应全部复归。 ( √ )", "options": [], "answer": "正确", "source": "依据 DL/T995-2016《继电保护和电网安全自动装置检验规程》"}, {"id": 301, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 20, "text": "变压器带容性负荷时电压最高。", "options": [], "answer": "正确", "source": ""}, {"id": 302, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 21, "text": "目前光伏电站常用的太阳能电池组件为非晶硅。", "options": [], "answer": "错误", "source": "解析：【依据 GB/T 50797-2012《光伏发电站设计规范》第2.4.1条规定：目前光伏电站常用的太阳能电池组件为多晶硅"}, {"id": 303, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 22, "text": "在电网特殊运行方式下，当通过调节无功和有载调压变压器不能满足电压调节要求时，应依据电网调度机构的指令通过调节有功功率进行电压控制。", "options": [], "answer": "正确", "source": "依据 GB/T 29321-2012 光伏发电站无功补偿技术规范》第 8.4.2条规定"}, {"id": 304, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 23, "text": "帽式接续盒安装应平行于地面，卧式接续盒应垂直于地面。", "options": [], "answer": "错误", "source": "解析：【依据 DL/T 5344-2018《电力光纤通信工程验收规范》第 4.2.7条规定：帽式接续盒安装应垂直于地面，卧式接续盒应平行于地面"}, {"id": 305, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 24, "text": "采用不对应启动重合闸方式的线路，若运行人员进行机构箱维护时不小心误碰跳闸线圈造成线路断路器跳闸，断路器将不会重合。", "options": [], "answer": "错误", "source": "解析：运行人员进行机构箱维护时不小心误碰跳闸线圈造成线路断路器跳闸，属于不对应启动的情况，断路器会重合。"}, {"id": 306, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 25, "text": "在风力发电机组故障诊断过程中，要想使故障诊断分析达到预定的目标，还依赖于对风力发电机组设备故障诊断实施技术。 ( )", "options": [], "answer": "正确", "source": ""}, {"id": 307, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 26, "text": "测控装置能够输出防误闭锁接点，闭锁设备的遥控和手动操作。", "options": [], "answer": "正确", "source": "依据 DL/T1404-2015《变电站监控系统防止电气误操作技术》第 6.1 条规定"}, {"id": 308, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 27, "text": "光纤纵联保护的信号数字复用接 口、保护PCM 设备均应将告警信号接到主控室光字牌。", "options": [], "answer": "正确", "source": "依据《国家电网公司继电保护培训教材》2019 版"}, {"id": 309, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 28, "text": "高低压线路同杆塔架设，在低压带电线路上工作时，应先检查与高压 线的距离，采取防止误碰带电高压设备的措施。在低压带电导线未采取绝缘措施时，工作人员不应穿越。", "options": [], "answer": "正确", "source": ""}, {"id": 310, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 29, "text": "大雨是发生污闪的最危险气象条件。 ( )", "options": [], "answer": "错误", "source": "解析：【依据《高电压技术》吴广宁、张冠军、刘刚 2017 版】诱发污闪的主要气象条件是浓雾、小雪、雨夹雪、毛毛雨、小雨、冰融等恶劣天气。"}, {"id": 311, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 30, "text": "光伏发电站的职业安全与职业病危害防护设施和各项措施应与主体工程同时设计、同时施工、同时投入生产和使用。规定】", "options": [], "answer": "正确", "source": "依据 GB/T 50797-2012《光伏发电站设计规范》第 13.0.2 条"}, {"id": 312, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 31, "text": "在大气压力下空气间隙击穿电压与阴极材料无关。 ( )", "options": [], "answer": "正确", "source": "依据《高电压技术》吴广宁、张冠军、刘刚 2017 版"}, {"id": 313, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 32, "text": "电池模块应在不完全放电状态下运输。荷电状态应根据运输时间和自放电情况确定，一般应在 30%～80%。", "options": [], "answer": "错误", "source": "解析：【依据 NB/T 42091-2016《电化学储能电站用锂离子电池技术规范》第 7.3.1 条规定：电池模块应在不完全放电状态下运输。荷电状态应根据运输时间和自放电情况确定，一般应在 20%～60%"}, {"id": 314, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 33, "text": "两台变压器并联运行时，其容量不宜相差过大。", "options": [], "answer": "正确", "source": ""}, {"id": 315, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 34, "text": "额定电压为220V 及以下的蓄电池室内的金属支架可不接地 ( )", "options": [], "answer": "正确", "source": "依据 DL/T 5852-2022《电气装置安装工程接地工程施工及验收规范》"}, {"id": 316, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 35, "text": "消弧线圈二次电压回路无需安装断路器。 ( )", "options": [], "answer": "错误", "source": "解析：消弧线圈二次电压回路应安装断路器。"}, {"id": 317, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 36, "text": "设备检修后合闸送电前，检查送电范围内的接地线已拆除、接地开关(接地刀闸) 已拉开不需要填入操作票。 ( )", "options": [], "answer": "错误", "source": "解析：必须填入操作票。"}, {"id": 318, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 37, "text": "阳光的辐射造成地球表面受热不均，引起大气层中压力分布不均从而导致空气流动形成。", "options": [], "answer": "正确", "source": ""}, {"id": 319, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 38, "text": "辐照度不变的情况下，光伏组件开路电压与温度近似呈线性关系，温度越高，电压越高。( )", "options": [], "answer": "错误", "source": "解析：温度越高，电压越低。"}, {"id": 320, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 39, "text": "终端直馈线停电：先停送电端，后停受电端。", "options": [], "answer": "错误", "source": "解析：终端直馈线停电：先停受电端，后停送电端。"}, {"id": 321, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 40, "text": "光伏组件转换效率衰减测试，以电站所用光伏组件品牌型号为单位，按照总数量万分之一随机抽取，组件不足一万块的随机抽取一块。", "options": [], "answer": "正确", "source": "依据 GB/T 20046-2006《光伏（PV）系统电网接口特性》第3.2.5 条规定"}, {"id": 322, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 41, "text": "光伏系统并网运行（仅对三相输出）时，电网接口处的三相电压不平衡度允许值为 2％，短时不得超过 4％。", "options": [], "answer": "正确", "source": "依据 GB/T 19939-2005《光伏系统并网技术要求》第 5.5 条规定"}, {"id": 323, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 42, "text": "余缆架应使用钢抱箍固定。对于铁塔，应安装于铁塔底部的第一个横隔面上。", "options": [], "answer": "正确", "source": "依据 DL/T 5344-2018《电力光纤通信工程验收规范》第 4.2.6条规定"}, {"id": 324, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 43, "text": "若不考虑电流和线路电阻，在大电流接地系统中发生接地短路时，零序电流超前零序电压 90 度。", "options": [], "answer": "正确", "source": ""}, {"id": 325, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 44, "text": "低压是指配电交流系统中 1000V 及以下等级的电压。", "options": [], "answer": "正确", "source": ""}, {"id": 326, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 45, "text": "集中式逆变器数量少，可集中安装，便于管理；集成度高，功率密度大，成本高。五章第三节规定：集中式逆变器集成度高，功率密度大，成本低】", "options": [], "answer": "错误", "source": "解析：【依据《光伏发电设备维护与检修》华电集团有限公司 2023版 第"}, {"id": 327, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 46, "text": "齿轮油油泥析出异常的原因通常为油品老化。( )", "options": [], "answer": "正确", "source": "依据 DL/T 1461-2015《发电厂齿轮用油运行及维护管理导则》"}, {"id": 328, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 47, "text": "继电保护的运行整定，应以保证系统的安全稳定运行为根本目标。", "options": [], "answer": "正确", "source": ""}, {"id": 329, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 48, "text": "特种作业人员和特种设备作业人员必须按照国家有关规定经过专门的安全作业培训，取得特种作业操作证、特种设备作业人员证，方可从事相应的作业。", "options": [], "answer": "正确", "source": "依据《防止电力建设工程施工安全事故三十项重点要求（2023版）》第 1.9 条规定"}, {"id": 330, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 49, "text": "光伏发电站中属于电网调度管辖的设备，运行人员应按照调度指令操作；操作电网调度许可范围内的设备，应得到电网调度部门的同意。但光伏发电站的运行方式及涉网设备参数的调整不需要按照电网调度部门的要求进行。", "options": [], "answer": "正确", "source": "依据 GB/T 38335-2019《光伏发电站运行规程》第 5.1.2 条的规定"}, {"id": 331, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 50, "text": "SGB-750 数字式母线保护装置检测到“失灵开入 ”长期误开入（10s），发“运行异常 ”告警信号，同时闭锁该支路的失灵保护。", "options": [], "answer": "正确", "source": "依据《SGB-750 数字式母线保护装置说明书》"}, {"id": 332, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 51, "text": "直调（控）厂站的信息采集应按照直调直采、直采直送原则设计，非直调厂站的信息采集可通过直采方式送到相关调度端。", "options": [], "answer": "正确", "source": "依据 DL/T5003-2017《电力系统调度自动化设计规程》第 5.1.1条的规定"}, {"id": 333, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 52, "text": "建筑物上安装的光伏发电系统，不得降低相邻建筑物的日照标准。", "options": [], "answer": "正确", "source": "依据 GB/T 50797-2012《光伏发电站设计规范》第 2.3.3 规定"}, {"id": 334, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 53, "text": "风轮仰角是为了增加风力发电机组扫风面积从而增大发电量。 ( )", "options": [], "answer": "错误", "source": "解析：风轮的仰角是指风轮的旋转轴线和水平面的夹角。"}, {"id": 335, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 54, "text": "在抗风状态下，太阳跟踪系统应能经受33m/s的风速；在12级风以上地区，应能经受42m/s的风速。", "options": [], "answer": "正确", "source": "依据 GB/T 29320-2012《光伏电站太阳跟踪系统技术要求》第 4.2.1 条规定"}, {"id": 336, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 55, "text": "通过 380V 电压等级接入电网的光伏发电系统宜采用熔断器或断路器，可不配置专用的继电保护装置。", "options": [], "answer": "正确", "source": "对【依据 GB/T 50865-2013《光伏发电接入配电网设计规范》第6.2.1 条规定"}, {"id": 337, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 56, "text": "逆变器交流输出与机壳间的绝缘电阻应大于等于 100MΩ。五章第七节规定：逆变器交流输出与机壳间的绝缘电阻应大于等于 50MΩ】", "options": [], "answer": "错误", "source": "解析：【依据《光伏发电设备维护与检修》华电集团有限公司 2023 版 第"}, {"id": 338, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 57, "text": "变压器室、电缆夹层、配电装置室的门应向疏散方向开启。", "options": [], "answer": "正确", "source": "依据 GB/T 50797-2012《光伏发电站设计规范》第 14.4.1 条规定"}, {"id": 339, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 58, "text": "水电解制氢/燃料电池系统涉氢设备或管道放置房间应设置一个总机械排风系统，并与氢气检测报警系统联锁控制。", "options": [], "answer": "错误", "source": "解析：【依据 GB/T 42288-2022《电化学储能电站安全规程》第 5.7.3条规定：水电解制氢/燃料电池系统涉氢设备或管道放置房间均应设置单独机械排风系统，并与氢气检测报警系统联锁控制"}, {"id": 340, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 59, "text": "光伏发电站设计时应对站址及周围区域的工程地址情况进行勘探和调查，查明站址的地形地貌特征、结构和主要地层的分布及物理力学性质、地下水条件等。", "options": [], "answer": "正确", "source": "依据 GB/T 50797-2012《光伏发电站设计规范》第 2.5.1 规定"}, {"id": 341, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 60, "text": "超短期预测第 4 小时月平均绝对误差应小于 0.10。", "options": [], "answer": "正确", "source": "依据 GB/T 19964-2012《光伏发电站接入电力系统技术规定》第 5.3 条规定"}, {"id": 342, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 61, "text": "对测量用电流互感器除了幅值准确度要求外，还有角度误差要求。", "options": [], "answer": "正确", "source": ""}, {"id": 343, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 62, "text": "陆上风力发电机组在出现塔筒开裂、倾斜等异常状态时，宜部署塔架与基础状态感知系统。", "options": [], "answer": "正确", "source": "当陆上风力发电机组出现塔筒开裂、倾斜等异常时，部署塔架与基础状态感知系统，能够实时监测塔架的应力、变形、振动以及基础的沉降、位移等关键数据，及时预警结构损伤的发展趋势，避免塔筒失稳、坍塌等严重安全事故，同时也能为后续的维修加固提供数据支撑。"}, {"id": 344, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 63, "text": "逆变器输出短路保护其动作时间应小于或等于 1s。", "options": [], "answer": "错误", "source": "解析：【依据 GB/T 20321.1-20069《离网型风能、太阳能发电系统用逆变器第 1 部分：技术条件》第 5.8 条规定：逆变器输出短路保护其动作时间应小于或等于 0.5s"}, {"id": 345, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 64, "text": "独立光伏发电系统的安装容量应依据负载所需电能和当地日照条件来确定。", "options": [], "answer": "正确", "source": "依据 GB/T 50797-2012《光伏发电站设计规范》第 6.1.6 条规定"}, {"id": 346, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 65, "text": "由于风力发电机组循环系统运行好坏对齿轮箱影响重大，检查齿轮箱循环冷却系统时，要重点对循环系统油管的磨损情况进行检查。目前大型兆瓦级以上齿轮箱都采用飞溅润滑方式。", "options": [], "answer": "错误", "source": "目前大型兆瓦级以上风力发电机组齿轮箱都采用强制润滑，兆瓦级以下多采用飞溅润滑方式。"}, {"id": 347, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 66, "text": "光伏方阵检修作业，宜采用先进工艺和新技术、新方法，提高工作效率。", "options": [], "answer": "正确", "source": "依据 GB/T 36567-2018《光伏组件检修规程》第 4.5 条的规定"}, {"id": 348, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 67, "text": "气体绝缘金属封闭开关设备断路器相间合闸不同期不大于 5ms。 ( )", "options": [], "answer": "正确", "source": ""}, {"id": 349, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 68, "text": "光伏方阵电气设备的日常维护检修宜选择光照较弱的时段进行。", "options": [], "answer": "正确", "source": ""}, {"id": 350, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 69, "text": "根据永磁体在转子上的位置不同，永磁同步电动机主要分为表面式和内置式。( )", "options": [], "answer": "正确", "source": ""}, {"id": 351, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 70, "text": "根据《电力行业网络安全等级保护基本要求》，应关闭不需要的网络端 口，关闭不需要的网络服务。", "options": [], "answer": "正确", "source": ""}, {"id": 352, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 71, "text": "跳闸出口应能自保持，直至断路器断开。 自保持宜由断路器的操作回路来实现。", "options": [], "answer": "正确", "source": "依据 GB/T14285-2023《继电保护和安全自动装置技术规程》"}, {"id": 353, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 72, "text": "检修汇流箱输出至直流柜段时，除断开断路器取下保险外，还应将相应的直流柜空开断开，验明无电后方可工作。", "options": [], "answer": "正确", "source": ""}, {"id": 354, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 73, "text": "风电场在变更参数进行故障验证或功能测试前，应履行审核批准流程。试验完成后应恢复原值并由专项管理人员进行核对。 ( )", "options": [], "answer": "正确", "source": "依据《风电机组控制与保护参数运行管理规范》 NB ∕ T 10986-2022"}, {"id": 355, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 74, "text": "光伏组件及连接电缆着火时，应立即切断对应的汇流箱开关，取下对应的直流保险，迅速采取灭火措施。", "options": [], "answer": "正确", "source": "依据 GB/T 35694-2017《光伏发电站安全规程》第 5.6.6 条规定"}, {"id": 356, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 75, "text": "逆变器介电强度是指电路与外壳之间应能承受 50Hz、正弦波电压为1500V、历时 1min 的试验而不击穿。逆变器第 1 部分：技术条件》第 5.13 条规定】", "options": [], "answer": "正确", "source": "依据 GB/T 20321.1-20069《离网型风能、太阳能发电系统用"}, {"id": 357, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 76, "text": "光伏发电站一般无高压站用电设备，所以站用电的电压宜采用220V。", "options": [], "answer": "错误", "source": "解析：【依据 GB/T 50797-2012《光伏发电站设计规范》条文说明中第8.3.1条规定：光伏发电站一般无高压站用电设备，所以站用电的电压宜采用380V"}, {"id": 358, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 77, "text": "专职监护人应监督被监护人员执行华电集团《电力安全工作规程》和现场安全措 施，及时纠正不安全行为。 ( )", "options": [], "answer": "正确", "source": ""}, {"id": 359, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 78, "text": "光伏发电站中，以一定数量的光伏组件串，通过直流汇流箱汇集，经逆变器逆变与隔离升压变压器升压成符合电网频率和电压要求的电源。又称单元发电模块。", "options": [], "answer": "正确", "source": "依据 GB/T 50797-2012《光伏发电站设计规范》第 2.1.3 条规定"}, {"id": 360, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 79, "text": "通过 110kV 及以上电压等级接入的光伏发电站应配置同步相量测量装置。", "options": [], "answer": "错误", "source": "解析：【依据 GB/T 50865-2013《光伏发电接入配电网设计规范》第 6.4.6条规定：通过 220kV 及以上电压等级接入的光伏发电站应配置同步相量测量装置"}, {"id": 361, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 80, "text": "漏洞扫描是入侵检测系统的一项功能。", "options": [], "answer": "错误", "source": "解析：两个系统"}, {"id": 362, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 81, "text": "平台、走道、吊装孔等有坠落危险处，应设栏杆或盖板。需登高检查、维修及更换光伏组件处，应设操作平台或扶梯。", "options": [], "answer": "正确", "source": "依据 GB/T 50797-2012《光伏发电站设计规范》第 13.0.6 条规定"}, {"id": 363, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 82, "text": "建筑一体化光伏组件的构造及安装应采取通风降温措施。", "options": [], "answer": "正确", "source": "依据 GB/T 50797-2012《光伏发电站设计规范》第 10.3.8 条规定"}, {"id": 364, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 83, "text": "设备解体检修时，可以直接将设备内的六氟化硫气体排放到大气中。( )", "options": [], "answer": "错误", "source": "解析：【依据 DL/T 595-2016《六氟化硫电气设备气体监督导则》】设备解体检修前，应对设备内的六氟化硫气体进行回收，不得直接向大气排放。"}, {"id": 365, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 84, "text": "海拔高度在2000m及以上高原地区使用的逆变器，应选用高原型（G）产品或采取降容使用措施。", "options": [], "answer": "正确", "source": "依据 GB/T 50797-2012《光伏发电站设计规范》第 6.3.9 条规定"}, {"id": 366, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 85, "text": "进入自然通风换气效果不良的有限空间，必须采取机械连续通风，严禁使用纯氧通风。", "options": [], "answer": "正确", "source": "依据《防止电力建设工程施工安全事故三十项重点要求（2023版）》第 13.4.1 条规定"}, {"id": 367, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 86, "text": "光伏组件检修完毕，应带走更换以及损坏的光伏组件和插接头等，检查确认检修现场无遗留物品。", "options": [], "answer": "正确", "source": "依据 GB/T 36567-2018《光伏组件检修规程》第 5.1.5 条规定"}, {"id": 368, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 87, "text": "将若干个光伏组件在机械和电气上按一定方式组装在一起并且有固定的支撑结构而构成的直流发电单元，又称光伏组串。", "options": [], "answer": "错误", "source": "解析：【依据 GB/T 50797-2012《光伏发电站设计规范》第2.1.4条规定：将若干个光伏组件在机械和电气上按一定方式组装在一起并且有固定的 支撑结构而构成的直流发电单元，称为光伏阵列"}, {"id": 369, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 88, "text": "火灾、地震、台风、洪水等灾害发生时，如要对光伏组件进行巡视时，应得到设备运行管理单位有关领导的批准，并至少应有两人一同巡视。", "options": [], "answer": "正确", "source": ""}, {"id": 370, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 89, "text": "填充因子是衡量组件将太阳能转换为电能的能力。", "options": [], "answer": "错误", "source": "解析：填充因子是指太阳能电池最大功率与开路电压与短路电流乘积的比值，是评价太阳能电池输出特性的一个重要参数。它的值越高，表明太阳能电池的输出特性越趋近于矩形，光电转换效率越高。"}, {"id": 371, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 90, "text": "单晶硅硅片因为使用硅棒原因，四周有圆形大倒角，而多晶硅一般采用小倒角。", "options": [], "answer": "正确", "source": "依据《光伏发电技术及应用》华电集团有限公司 2023 版 第"}, {"id": 372, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 91, "text": "无功电压控制系统响应时间应不超过 10s，无功功率控制偏差的绝对值不超过给定值的 5%，电压调节精度在 0.005 倍标称电压内。", "options": [], "answer": "正确", "source": "依据 GB/T 29321-2012《光伏发电站无功补偿技术规范》第"}, {"id": 373, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 92, "text": "在纯电感电路中，电流超前电压90°。", "options": [], "answer": "错误", "source": "解析：在纯电感电路中，电压超前电流90°。"}, {"id": 374, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 93, "text": "逆变器除具有将直流电逆变为交流电的功能外，还应具有最大限度的发挥光伏电池性能以及系统故障保护的功能。", "options": [], "answer": "正确", "source": "依据 GB/T 50797-2012《光伏发电站设计规范》第 4.5.2 条规定"}, {"id": 375, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 94, "text": "设备在储存期间，应放在空气流通、温度在 0℃-55℃ 、月平均相对湿度不大于 90%、无腐蚀性和爆炸气体的仓库内，在储存期间不应淋雨、暴晒、凝露和霜冻。", "options": [], "answer": "错误", "source": "解析：【依据 NB/T 42091-2016《电化学储能电站用锂离子电池技术规范》第 7.4.1 条规定：设备在储存期间，应放在空气流通、温度在-20℃-55℃的仓库内"}, {"id": 376, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 95, "text": "对于220kV 及以上电网的线路保护系统全相运行，发生振荡时，如被保护线路发生三相短路故障，故障线路的保护装置不应动作跳闸。", "options": [], "answer": "错误", "source": "解析：【依据GB/T14285-2023《继电保护和安全自动装置技术规程》】故障线路的保护应可靠动作跳闸，并允许带短延时。"}, {"id": 377, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 96, "text": "当电网频率超出± 0.5 Hz范围时，系统应在0.2s以内停止向电网线路送电。", "options": [], "answer": "正确", "source": "依据 GB/T 20046-2006《光伏（PV）系统电网接口特性》第"}, {"id": 378, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 97, "text": "电力监控系统中的实时控制系统和有实时控制功能的业务模块以及未来有实时控制功能的业务系统应当置于控制区。", "options": [], "answer": "正确", "source": ""}, {"id": 379, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 98, "text": "海上风力发电机组主控系统内所有裸露部分导体、连接头、端子排均应做防腐、防潮处理。", "options": [], "answer": "正确", "source": "依据 NB∕T 31043-2019《海上风力发电机组主控制系统技术规范》"}, {"id": 380, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 99, "text": "电缆终端与接头制作前应核对电缆相序或极性，制作过程中应防止损伤主绝缘。 ( )", "options": [], "answer": "正确", "source": "依据《集团公司风力发电企业技术监督实施规范》中国华电生函〔2022〕 480 号"}, {"id": 381, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 100, "text": "光伏发电站一次调频功能应自动投入，技术指标满足依据《并网电源一次调频技术规定》及试验导则（GB/T 40595-2021）和当地电网的要求，光伏发电站调频死区在 ± 0.02Hz- ± 0.06Hz 范围内。", "options": [], "answer": "正确", "source": "依据《防止电力生产事故的二十五项重点要求（2023 版）》第 5.2.8 条规定"}, {"id": 382, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 101, "text": "由于光的颜色（波长）不同，转变为电能的比例也不同，这种特性称为“光谱特性”。", "options": [], "answer": "正确", "source": "依据《光伏发电技术及应用》华电集团有限公司 2023 版 第4.2.1 条规定"}, {"id": 383, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 102, "text": "正常运行时，光伏系统和电网接口处三相电压的允许偏差为额定电压的 ±5%。", "options": [], "answer": "错误", "source": "解析：【依据 GB/ T19939-2005《光伏系统并网技术要求》第 8.1 条规定：三相电压的允许偏差为额定电压的±7%，单相电压的允许偏差为额定电压的+7%、-10%。"}, {"id": 384, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 103, "text": "在非零初始条件下，刚一换路瞬间，电容元件相当于一个恒压源。( )", "options": [], "answer": "正确", "source": ""}, {"id": 385, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 104, "text": "光缆在电缆沟内应穿阻燃子管保护并每隔 1m～2m 绑扎固定在支架上，保护管内径不应小于 30mm。条规定：光缆在电缆沟内保护管内径不应小于 32mm】", "options": [], "answer": "错误", "source": "解析：【依据 DL/T 5344-2018《电力光纤通信工程验收规范》第 4.3.5"}, {"id": 386, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 105, "text": "依据《中国华电集团有限公司新能源生产数字系统数据接入指导意见(试行)》互 联互通，共建共享原则，为各业务模块提供信息共享，业务联动，交叉稽核的数据基础和 技术手段，保证接入数据的关联性、时效性、可访问性。 ( )", "options": [], "answer": "正确", "source": ""}, {"id": 387, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 106, "text": "光伏组件方阵可分为平板式和聚光式。", "options": [], "answer": "正确", "source": ""}, {"id": 388, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 107, "text": "风力发电机组变桨系统是通过叶片和轮毂之间的轴承机构，借助控制技术和动力 系统转动叶片来控制叶片桨距角，调节风轮的能量吸收，以达到改变作用在风轮叶片上的 转矩，保持一定的输出功率的目的。 ( )", "options": [], "answer": "正确", "source": ""}, {"id": 389, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 108, "text": "一台就地升压变压器连接两台不自带隔离变压器的逆变器时，宜选用分裂变压器。", "options": [], "answer": "正确", "source": "依据 GB/T 50797-2012《光伏发电站设计规范》第 8.2.1 条规定"}, {"id": 390, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 109, "text": "光伏电站进入生产现场的人员，应遵守现场安全文明施工纪律，作业过程中减少交叉作业。", "options": [], "answer": "正确", "source": ""}, {"id": 391, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 110, "text": "监控系统电源应符合 GB/T 13729 的要求，不间断电源(UPS) 在交流电源失电或电源不符合要求时，维持系统正常工作时间不低于 1h ( )", "options": [], "answer": "错误", "source": "维持系统正常工作时间不低于 2h,依据 NB/T 10321-2019《 风电场监控系统技术规范》"}, {"id": 392, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 111, "text": "检测指标包括氧气浓度、易燃易爆物质（可燃性气体、爆炸性粉尘）浓度、有毒有害气体浓度，检测必须在作业开始前 15分钟内实施。", "options": [], "answer": "错误", "source": "解析：【依据《防止电力建设工程施工安全事故三十项重点要求（2023版）》第 13.3.5 条规定：检测指标包括氧气浓度、易燃易爆物质（可燃性气体、爆炸性粉尘）浓度、有毒有害气体浓度，检测必须在作业开始前30 分钟内实施"}, {"id": 393, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 112, "text": "使用金属边框的光伏组件，边框可以不接地。", "options": [], "answer": "错误", "source": "解析：【依据《光伏发电技术及应用》华电集团有限公司 2023 版 第 6.3.1条规定】使用金属边框的光伏组件，边框必须接地。"}, {"id": 394, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 113, "text": "黏度指数是表示油品黏度随温度变化特性的一个约定量值。", "options": [], "answer": "正确", "source": ""}, {"id": 395, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 114, "text": "水电解制氢/燃料电池系统应采取防静电措施。", "options": [], "answer": "正确", "source": "依据 GB/T 42288-2022《电化学储能电站安全规程》第 5.2.8条规定"}, {"id": 396, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 115, "text": "检修及调试工作结束，应核对逆变器及涉网设备运行参数及保护定值，恢复正常设置。", "options": [], "answer": "正确", "source": "依据 GB/T 35694-2017《光伏发电站安全规程》第 6.1.3 条规定"}, {"id": 397, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 116, "text": "风力发电机组偏航应急侧风保护，即当风速大于风力发电机组设定的安全条件， 风轮转速超过硬件保护限值或叶片变桨失效时，风力发电机组立即执行偏航应急侧风保护 功能，偏航角度一般为60°。 ( )", "options": [], "answer": "错误", "source": "解析：偏航角度一般为90°。"}, {"id": 398, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 117, "text": "运行中电气设备的瓷质部分可以视为不带电的部分。( )", "options": [], "answer": "错误", "source": "解析：运行中的电气设备的瓷质部分应视为带电部分。"}, {"id": 399, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 118, "text": "光伏发电站汇集线系统应采用经电阻或消弧线圈接地方式。", "options": [], "answer": "正确", "source": "依据《防止电力生产事故的二十五项重点要求（2023 版）》第 5.2.14 条规定"}, {"id": 400, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 119, "text": "风力发电机组空气动力刹车是一种保护装置，它提高了整个风力发电机组制动系 统的可靠性。 ( )", "options": [], "answer": "正确", "source": ""}, {"id": 401, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 120, "text": "通过线圈的电流大小、方向均恒定不变时，线圈自感电动势等于零。 ( )", "options": [], "answer": "正确", "source": ""}, {"id": 402, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 121, "text": "在光伏发电厂中逆变器机柜内的保护措施，应能够满足防止对检修与调试人员直接接触电极部分的要求。", "options": [], "answer": "正确", "source": ""}, {"id": 403, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 122, "text": "风电场安装的测风塔每季度对拉线进行紧固和检查。", "options": [], "answer": "错误", "source": "风电场安装的测风塔每半年对拉线进行紧固和检查。"}, {"id": 404, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 123, "text": "传输数据的金属线缆超过一定距离时导致信号衰减，远距离网络电缆传输时，一般采用光纤电缆。", "options": [], "answer": "正确", "source": "依据 GB/T 50797-2012《光伏发电站设计规范》第 8.9.6 条规定"}, {"id": 405, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 124, "text": "试验室应建立完善试验室管理制度、试验仪器仪表、标气、化学试剂等管理办法。", "options": [], "answer": "正确", "source": "依据《中国华电集团有限公司.风力发电企业技术监督实施规范》 中国华电生函〔2022〕480 号"}, {"id": 406, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 125, "text": "风力发电机组高速轴的功能是传递从风轮轮毂到齿轮箱的驱动转矩，并将风轮的 其他载荷传递到机舱。 ( )", "options": [], "answer": "错误", "source": "解析：低速轴的功能是传递。"}, {"id": 407, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 126, "text": "交流电的初相位是当 t = 0 时的相位，用 ψ表示。( )", "options": [], "answer": "正确", "source": ""}, {"id": 408, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 127, "text": "《中华人民共和国网络安全法》中要求，关键信息基础设施的范围是在定级备案的第二级及以上的保护对象中确定。", "options": [], "answer": "错误", "source": "解析：关键信息基础设施的范围是在定级备案的第三级及以上的保护对象中确定。"}, {"id": 409, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 128, "text": "光伏发电系统中逆变器的配置容量应与光伏方阵的安装容量相匹配，逆变器允许的最大直流输入功率应不大于其对应的光伏方阵的实际最大直流输出功率。", "options": [], "answer": "错误", "source": "解析：【依据 GB/T 50797-2012《光伏发电站设计规范》第 6.1.4 条规定：逆变器允许的最大直流输入功率应不小于其对应的光伏方阵的实际最大直流输出功率"}, {"id": 410, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 129, "text": "风电场接入电力系统后，并网点电压的正负偏差的绝对值不超过额定电压的5%。( )", "options": [], "answer": "错误", "source": "解析：不超过额定电压的10%。"}, {"id": 411, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 130, "text": "参考气象站应具有连续 15年以上的太阳辐射长期观测记录。", "options": [], "answer": "错误", "source": "解析：参考气象站应具有连续 10 年以上的太阳辐射长期观测记录。"}, {"id": 412, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 131, "text": "单位时间内所做的功叫做电功率。", "options": [], "answer": "正确", "source": ""}, {"id": 413, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 132, "text": "当蓄电池组的充电电流超过设定值的 110%，直流设备应发出报警信息。", "options": [], "answer": "正确", "source": ""}, {"id": 414, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 133, "text": "控制回路在双灯监视方式下，当断路器在跳闸位置时，若合闸回路完好则绿灯(GN)亮。", "options": [], "answer": "正确", "source": "依据《电气二次回路识图 王越明 2012 版》"}, {"id": 415, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 134, "text": "当三相异步电动机的负载减小时，其功率因数降低。", "options": [], "answer": "正确", "source": ""}, {"id": 416, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 135, "text": "每年至少检查一次变压器接地电阻。 ( )", "options": [], "answer": "正确", "source": ""}, {"id": 417, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 136, "text": "用于风电机组的润滑油(脂),一般对高温使用性能无特殊要求。 ( )", "options": [], "answer": "错误", "source": "解析：风力发电机组在工作过程中，高温是一个普遍存在的问题，润滑油必须具备良好 的高温特性才能满足要求。高温下，油品不能出现氧化、变质等现象，否则会导致设备损坏。"}, {"id": 418, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 137, "text": "在地下敷设电缆附近开挖土方时，可以使用机械开挖。", "options": [], "answer": "错误", "source": "解析：【依据《防止电力生产事故的二十五项重点要求（2023 版）》第1.2.14条规定：在地下敷设电缆附近开挖土方时，严禁使用机械开挖"}, {"id": 419, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 138, "text": "根据载波的幅值、频率和相位随调制信号而变化的过程，调制可以分为调幅、调频和调相，其波形分别称为调幅波、调频波和调相波。( )", "options": [], "answer": "正确", "source": ""}, {"id": 420, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 139, "text": "应用红外热成像技术可以在不破坏风电机组叶片的情况下，对其内部缺陷进行检测和评估。( )", "options": [], "answer": "正确", "source": ""}, {"id": 421, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 140, "text": "三相不一致由断路的一组 ABC 三常开接点并联，另一组 A、B、C 三相常闭接点并联，再将两者联后起动一只带延时的继电器来判断是否出现非全相运行", "options": [], "answer": "正确", "source": "依据《国家电网公司继电保护培训教材》2019 版"}, {"id": 422, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 141, "text": "Solaris 系统中，攻击者在系统中增加帐户会改 inetd.conf 、hosts文件：", "options": [], "answer": "错误", "source": "解析：shadow、 passwd 文件"}, {"id": 423, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 142, "text": "高压开关柜内避雷器、电压互感器等柜内设备应经隔离开关(或隔离手车)与母 线相连，不应与母线直接连接。 ( )", "options": [], "answer": "正确", "source": ""}, {"id": 424, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 143, "text": "逆变器出现声音异常、焦味、冒烟等异常情况，应立即停止逆变器运行。", "options": [], "answer": "正确", "source": "依据 GB/T 35694-2017《光伏发电站安全规程》第 5.6.12 条规定"}, {"id": 425, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 144, "text": "220kV 及以上电压等级的设备数量较多，电流回路电缆较长，电流互感器二次额定电流多采用 1A。", "options": [], "answer": "正确", "source": "依据《国家电网公司继电保护培训教材》2019 版"}, {"id": 426, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 145, "text": "电力系统中运行的避雷器主要有阀型避雷器和金属氧化物避雷器两种。 ( )", "options": [], "answer": "正确", "source": ""}, {"id": 427, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 146, "text": "风电场配置的安全设施、安全工器具和检修工器具等应检验合格且符合国家或行 业标准的规定。 ( )", "options": [], "answer": "正确", "source": ""}, {"id": 428, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 147, "text": "站用电工作变压器容量不宜小于计算负荷的 1.2 倍。", "options": [], "answer": "错误", "source": "解析：【依据 GB/T 50797-2012《光伏发电站设计规范》第 8.3.5 条规定：站用电工作变压器容量不宜小于计算负荷的 1.1 倍"}, {"id": 429, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 148, "text": "330kV 及以上电压等级变电站应采用三台充电、浮充电装置，两组蓄电池组的供电方式。", "options": [], "answer": "正确", "source": "依据《国家电网公司十八项电网重大反事故措施继电保护实施要点》"}, {"id": 430, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 149, "text": "当开关在分闸位置时，跳闸位置继电器（TWJ）的常闭接点是打开的。", "options": [], "answer": "正确", "source": ""}, {"id": 431, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 150, "text": "新能源场站全景监控系统业务属安全区二区，其网络安全防护总体上应满足GB/T 36572 及国家电网公司关于电力监控系统网络安全相关规范的要求。( )", "options": [], "answer": "错误", "source": "解析：新能源场站全景监控系统业务属安全区三区。"}, {"id": 432, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 151, "text": "当 UPS 直流失电时，会切至主路电源运行。", "options": [], "answer": "错误", "source": "解析：UPS 直流失电切至旁路电源运行。"}, {"id": 433, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 152, "text": "在运行电流互感器二次回路上工作时，应站在绝缘垫上或穿绝缘靴，以保证人身安全。", "options": [], "answer": "正确", "source": "依据GB50171-2012《电气装置安装工程盘、柜及二次回路接线施工及验收规范》"}, {"id": 434, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 153, "text": "工作票“工作班人员”栏：应将每个工作人员的姓名填入“工作班人员”栏，超 过10人的只填写10人姓名，并写明工作班人员人数(如×××等共 人)。“共人”的 总人数不包括工作负责人。 ( )", "options": [], "answer": "错误", "source": "解析：“ 共 人”的总人数包括工作负责人。"}, {"id": 435, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 154, "text": "架空电力线路是输送、分配电能的主要通道和工具。", "options": [], "answer": "正确", "source": ""}, {"id": 436, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 155, "text": "设备绝缘在直流电压下，其吸收电流的大小与时间有关，与设备绝缘结构，介质种类及温度无关。 ( )", "options": [], "answer": "错误", "source": "解析：【依据《电气试验（第二版）》陈天翔 2008 版】设备绝缘在直流电压下，其吸收电流的大小与时间有关，与设备绝缘结构、介质种类及温度有关。"}, {"id": 437, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 156, "text": "为保证发电机、联轴器等部件的使用寿命，必须每年进行两次同轴度检测。( )", "options": [], "answer": "正确", "source": ""}, {"id": 438, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 157, "text": "电化学储能电站安全工器具应定期检验，检验合格后方可使用。", "options": [], "answer": "正确", "source": "依据 GB/T 42288-2022《电化学储能电站安全规程》第 4.8条规定"}, {"id": 439, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 158, "text": "变压器油相对产气速率大于 10%/月则认为设备有异常 ( )", "options": [], "answer": "正确", "source": "依据 DL/T 596-2021《电力设备预防性试验规程》"}, {"id": 440, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 159, "text": "装、拆接地线导体端应使用绝缘棒，人体不应碰触接地线。", "options": [], "answer": "正确", "source": "装、拆接地线时，导体端直接与带电或可能带电的设备相连，使用绝缘棒操作可以隔绝电流，避免人体触电；同时严禁碰触接地线导体端，防止因设备突然来电或感应电造成人身伤害，这是电气作业的基本安全要求。"}, {"id": 441, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 160, "text": "变压器的并联运行是指一次绕组和二次绕组分别并联到一次侧和二次侧的公共母线上时的运行。 ( )", "options": [], "answer": "正确", "source": ""}, {"id": 442, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 161, "text": "当光伏系统中逆变器的输出大于其额定输出的 50%时，平均功率因数应不小于 0.9。", "options": [], "answer": "正确", "source": "依据 GB/T 19939-2005《光伏系统并网技术要求》第 5.4 条规定"}, {"id": 443, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 162, "text": "强油风冷变压器冷却装置全停时，无人值班变电站宜投报警信号。 ( )", "options": [], "answer": "错误", "source": "解析：宜投跳闸信号。"}, {"id": 444, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 163, "text": "激励频率接近固有频率时，振幅增大称为共振。共振峰大小决定于阻尼大小。( )", "options": [], "answer": "正确", "source": ""}, {"id": 445, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 164, "text": "电流互感器“减 ”极性标志的概念是：一次侧电流从极性端流入，二次侧电流从非极性端流出。", "options": [], "answer": "错误", "source": "解析：应是一次侧电流从极性端流入，二次侧电流从极性端流出。"}, {"id": 446, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 165, "text": "大、中型地面光伏发电站站区可设两个出入 口，其位置应使站内外联系方便。站区主要出入口处主干道行车部分的宽度宜采用 5m；次干道（环行道路）宽度宜采用 3m。通向建筑物出入口处的人行引道的宽度宜与门宽相适应。", "options": [], "answer": "错误", "source": "解析：【依据 GB/T 50797-2012《光伏发电站设计规范》第 7.1.6 条规定：主干道行车部分的宽度宜采用 6m，次干道（环行道路）宽度宜采用 4m"}, {"id": 447, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 166, "text": "雷雨天气时，禁止进行倒闸操作。 ( )", "options": [], "answer": "正确", "source": ""}, {"id": 448, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 167, "text": "光伏发电站发电时段(不含出力受控时段)的短期预测月平均绝对误差应小于 0.15,月合格率应大于80%;超短期预测第4小时月平均绝对误差应小于0. 10,月合格率应大于90%。 ( )", "options": [], "answer": "错误", "source": "解析：超短期预测月合格率应大于85%。"}, {"id": 449, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 168, "text": "手动操作断路器时，操作必须果断，严禁中途停顿。", "options": [], "answer": "正确", "source": ""}, {"id": 450, "sec": "判断题", "secIdx": 3, "type": "判断题", "num": 169, "text": "110（66）kV 输电线路不宜超过两年进行一次红外检测； ( )", "options": [], "answer": "正确", "source": "依据 DL/T 664-2016《带电设备红外诊断应用规范》"}, {"id": 451, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 1, "text": "检查背板接线盒密封是否完好，检查接线端子是否有__、烧灼痕迹，检查旁路二极管是否损坏。存在安全隐患或损坏时，应更换接线盒、接线端子或光伏组件。", "options": [], "answer": "过热", "source": "依据 GB/T 36567-2018《光伏组件检修规程》"}, {"id": 452, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 2, "text": "区域集控中心的功能是利用远程监控技术将区域内分散的光伏电站联系起来，实现区域__，与现场维护人员远程协同工作，制订检修计划，并为规模化检修维护提供技术支持。", "options": [], "answer": "集中运行监控", "source": "依据《光伏发电设备维护与检修》 华电集团有限公司 2023 版"}, {"id": 453, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 3, "text": "每__宜对单轴、双轴跟踪式光伏支架的方位角转动机构和高度角转动机构进行检查。", "options": [], "answer": "3 个月", "source": "依据 GB/T 35694-2017《光伏发电站安全规程》"}, {"id": 454, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 4, "text": "当__电池室设置于地下时，换气次数不少于每小时__次。", "options": [], "answer": "12", "source": "依据 GB/T 36276-2018《电化学储能电站设计规范》 "}, {"id": 455, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 5, "text": "储能电站电池宜采用模块化设计。锂离子电池模块的额定电压宜选 38.4V、48V、51.2V、64V、__V、153.6V、166.4V 等系列。", "options": [], "answer": "128", "source": "依据 GB/T 36276-2018《电化学储能电站设计规范》 "}, {"id": 456, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 6, "text": "齿轮箱巡视检查时，通过齿轮箱__检查齿轮啮合及齿表面情况。", "options": [], "answer": "观察窗", "source": ""}, {"id": 457, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 7, "text": "变压器油中溶解气体三比值编码组合为[0、0、0]，变压器可能存在__故障。", "options": [], "answer": "低温过热", "source": "依据 DL/T 722-2014《变压器油中溶解气体分析和判断导则》"}, {"id": 458, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 8, "text": "光伏发电系统按是否接入公共电网可分为__发电系统和独立光伏发电系统。", "options": [], "answer": "并网光伏", "source": "依据 GB/T 50797-2012《光伏电站设计规范》"}, {"id": 459, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 9, "text": "参考气象站应具有连续__以上的太阳辐射长期观测记录。", "options": [], "answer": "10 年", "source": ""}, {"id": 460, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 10, "text": "__指通过储能系统的调节，满足跟踪电网调度部门下达的风光储联合发电站出力曲线的要求。", "options": [], "answer": "跟踪计划出力", "source": "依据 GB/T 51437-2021《风光储联合发电站设计标准》"}, {"id": 461, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 11, "text": "光伏发电系统总装机容量为 100MW 及以上的支架检修可以按照__抽检。", "options": [], "answer": "0.5%〜1%", "source": "依据 GB/T 36567-2018《光伏组件检修规程》"}, {"id": 462, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 12, "text": "通过 10kV〜35kV 电压等级并网的光伏发电站功率因数应能在__范围内连续可调。", "options": [], "answer": "超前 0.98〜滞后 0.98", "source": "依据 GB/T 199964-2012《光伏发电站接入电力系统技术规定》"}, {"id": 463, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 13, "text": "雷雨季节前后测量叶片接闪器到其根部法兰之间的直流电阻，电阻值不应高于__。", "options": [], "answer": "0.058", "source": ""}, {"id": 464, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 14, "text": "学习贯彻落实习近平总书记重要指示批示精神情况，综合得分≧__分， 评价结果为优秀。", "options": [], "answer": "90", "source": ""}, {"id": 465, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 15, "text": "太阳能电池的光电转换效率随温度升高而__。", "options": [], "answer": "降低", "source": "依据 GB/T 36567-2018《光伏组件检修规程》"}, {"id": 466, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 16, "text": "储能设备布置可采用__布置、全户内布置和半户内布置三种型式。", "options": [], "answer": "全户外", "source": "依据 GB/T 36276-2018《电化学储能电站设计规范》"}, {"id": 467, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 17, "text": "对于小型光伏电站，电网电压异常达到 50%Un≤U＜85%Un 时，逆变器退出运行的时间是__秒。", "options": [], "answer": "2", "source": "依据 Q/GDW 617-2011《光伏电站接入电网技术规定》"}, {"id": 468, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 18, "text": "高压电气设备中的__是用来将高电压变换为低电压的设备，用于保护和测量。", "options": [], "answer": "电压互感器", "source": ""}, {"id": 469, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 19, "text": "汇流箱绝缘强度检测，漏电流应小于__mA。", "options": [], "answer": "20", "source": "依据《光伏发电设备维护与检修》 华电集团有限公司 2023版"}, {"id": 470, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 20, "text": "通过 35kV 及以上电压等级接入电网的光伏发电站，其升压站的主变压器应采用__。", "options": [], "answer": "有载调压变压器", "source": "依据 GB/T 199964-2012《光伏发电站接入电力系统技术规定》"}, {"id": 471, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 21, "text": "以太阳时角作标准的计时系统称为__。它是以日面中心在该地的上中天的时刻为零时。", "options": [], "answer": "真太阳时", "source": "依据 GB/T 50797-2012《光伏电站设计规范》"}, {"id": 472, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 22, "text": "润滑油油位低故障是由于齿轮箱或__出现泄漏，使润滑油下降，浮子开关动作停机，或因为油位传感器电路故障。", "options": [], "answer": "润滑油管路", "source": ""}, {"id": 473, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 23, "text": "光伏发电站宜设蓄电池组向继电保护、信号、__自动装置等控制负荷和交流不间断电源装置、断路器合闸机构及直流事故照明等动力负荷供电，蓄电池组应以__运行。", "options": [], "answer": "全浮充电方式", "source": "依据 GB/T 50797-2012《光伏电站设计规范》"}, {"id": 474, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 24, "text": "对光伏发电站送出线路，应在系统侧配置__、接地故障保护。", "options": [], "answer": "分段式相间", "source": ""}, {"id": 475, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 25, "text": "连接开关场和继电保护(小)室的二次电缆，应采用屏蔽电缆。电缆屏蔽层应在开关场、__分别接地。", "options": [], "answer": "继电保护（小）室", "source": "依据 GB/T14285-2023《继电保护和安全自动装置技术规程》"}, {"id": 476, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 26, "text": "低电压穿越是当电力系统事故或扰动引起光伏电站并网点的电压跌落时，在一定的__和时间间隔内，光伏电站能够保证不脱网连续运行。", "options": [], "answer": "电压跌落范围", "source": ""}, {"id": 477, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 27, "text": "光伏发电系统配套使用的主要是免维护铅酸电池、铅碳电池和__电池等。当有大容量电能存储时，就需要将多只蓄电池串、并联起来构成蓄电池组。", "options": [], "answer": "磷酸铁锂", "source": "依据《光伏发电设备维护与检修》 华电集团有限公司 2023 版"}, {"id": 478, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 28, "text": "光伏电站并网点的定义：对于有升压站的光伏电站，指升压站__。", "options": [], "answer": "高压侧母线或节点", "source": ""}, {"id": 479, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 29, "text": "对于按最佳固定倾角布置光伏方阵的大型光伏发电站，宜增设在设计确定的最佳固定倾角面上的__观测项目。", "options": [], "answer": "日照辐射", "source": "依据 GB/T 50797-2012《光伏电站设计规范》"}, {"id": 480, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 30, "text": "对于通过 220kV（或 330kV）光伏发电汇集系统升压至 500kV（或750kV）电压等级接入电网的光伏发电站群中的光伏发电站，容性无功容量能够补偿光伏发电站满发时汇集线路、主变压器的感性无功及光伏发电站送出线路的__。", "options": [], "answer": "全部感性无功之和", "source": "依据 GB/T 199964-2012《光伏发电站接入电力系统技术规定》"}, {"id": 481, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 31, "text": "监控系统宜设置__系统，__同步脉冲输出接口及数字接口应满足系统配置要求。", "options": [], "answer": "时钟同步", "source": "依据 GB/T 36276-2018《电化学储能电站设计规范》 "}, {"id": 482, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 32, "text": "光伏功率预测的基础数据应包括场站的静态信息、气候预报、数值天气预报、实测气象、__、设备运行状态、计划检修信息等。", "options": [], "answer": "实测功率", "source": "依据《光伏发电设备维护与检修》 华电集团有限公司 2023 版"}, {"id": 483, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 33, "text": "当多台储能变流器并联有谐波和环流抑制需求时，就地变压器可选用__变压器。", "options": [], "answer": "分裂绕组", "source": "依据 GB/T 36276-2018《电化学储能电站设计规范》 "}, {"id": 484, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 34, "text": "当怀疑变压器设备导电回路存在故障时，宜缩短检测周期至至少__一次。", "options": [], "answer": "每天", "source": "依据 DL/T 722-2014《变压器油中溶解气体分析和判断导则》"}, {"id": 485, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 35, "text": "使用__测量直流电阻。", "options": [], "answer": "电 桥", "source": ""}, {"id": 486, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 36, "text": "太阳能光伏控制器主要由__、开关元件和其他基本电子元件组成。", "options": [], "answer": "控制电路", "source": "依据 GB/T 36567-2018《光伏组件检修规程》"}, {"id": 487, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 37, "text": "当采用柜式结构多排布置时，宜依据柜体开门结构确定维护通道，维护通道宜满足表 6 的规定，且不宜小于单侧门宽加__。", "options": [], "answer": "400mm", "source": "依据 GB/T 36276-2018《电化学储能电站设计规范》"}, {"id": 488, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 38, "text": "操作票应由__填写，监护人和值班负责人、值长对操作票的操作风险、管控措施及操作项目分别进行审核并签名。", "options": [], "answer": "操作人", "source": ""}, {"id": 489, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 39, "text": "无功功率控制偏差的绝对值不超过给定值的__, 电压调节精度在0.005 倍标称电压内。", "options": [], "answer": "5%", "source": "依据 GB/T 29321-2012《光伏发电站无功补偿技术规范》"}, {"id": 490, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 40, "text": "储能电站中布置有电池或重要电气设备的建筑物屋面防水等级应采用__级。", "options": [], "answer": "I", "source": "依据 GB/T 36276-2018《电化学储能电站设计规范》 "}, {"id": 491, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 41, "text": "利用气相色谱分析仪检测油中溶解气体含量，其气路由载气、氢气和__三路气体组成。", "options": [], "answer": "空气", "source": "依据《电力用油气检测及监督管理题库》中国华电电力科学研究院2020 版"}, {"id": 492, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 42, "text": "线聚焦聚光宜采用单轴跟踪系统，点聚焦聚光应采用__跟踪系统。", "options": [], "answer": "双轴", "source": "依据 GB/T 50797-2012《光伏电站设计规范》"}, {"id": 493, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 43, "text": "每段 35kV 母线上配置 1 组容量为__的SVG 功补偿装置。", "options": [], "answer": "± 10Mvar", "source": "依据《光伏发电设备维护与检修》 华电集团有限公司 2023 版"}, {"id": 494, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 44, "text": "大型储能电站的电站功率__。", "options": [], "answer": "大于等于 100MW", "source": "依据 GB/T 36276-2018《电化学储能电站设计规范》"}, {"id": 495, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 45, "text": "储能电站电气设备房间不宜布置液流电池的电解液管道，若因布置空间受限必须布置时， 电气设备防护等级应不低于__。", "options": [], "answer": "IP54", "source": "依据 GB/T 36276-2018《电化学储能电站设计规范》"}, {"id": 496, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 46, "text": "一般__将充电装置自动地或手动对蓄电池组进行一次恒流限压一恒压(限流) —浮充电的均衡充电，以避免蓄电池组在浮充电下个别蓄电池长期处于欠充或过充，产生的电压不均匀现象，造成蓄电池容量早衰。", "options": [], "answer": "3 个月～6 个月", "source": "依据 DL/T724-2021《电力系统用蓄电池直流电源装置运行与维护技术规程》"}, {"id": 497, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 47, "text": "接入__kV及以上电压等级的大型光伏电站应装设同步相量测量单元（PMU），为光伏电站的安全监控与电力调度部门提供统一时标下的光伏电站暂态过程中的电压、相角、功率等参数的变化曲线。", "options": [], "answer": "220", "source": "依据 Q/GDW 617-2011《光伏电站接入电网技术规定》"}, {"id": 498, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 48, "text": "温度直接测量或红外照相探测时，被探测光伏组件处于正常工作模式（峰值功率跟踪）。其表面的辐照度应超过__W/m² , 且气象条件稳定。", "options": [], "answer": "400", "source": ""}, {"id": 499, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 49, "text": "通过 10（6）kV 电压等级接入电网的光伏发电站，其并网点电压偏差为相应系统标称电压的__。", "options": [], "answer": "±7%", "source": "依据 GB/T 29321-2012《光伏发电站无功补偿技术规范》"}, {"id": 500, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 50, "text": "电力系统中谐波产生的根本原因是__所致。", "options": [], "answer": "非线性负载", "source": "依据《光伏发电设备维护与检修》 华电集团有限公司 2023 版"}, {"id": 501, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 51, "text": "光伏无人机感知系统数据接入主要内容为__感知数据，视频、图片等数据。", "options": [], "answer": "温度", "source": "依据《中国华电集团有限公司新能源生产数字系统数据接入指导意见》中国华电函〔2023〕113 号"}, {"id": 502, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 52, "text": "检测薄膜光伏组件宜采用__方式。", "options": [], "answer": "短波红外", "source": "依据 GB/T 36567-2018《光伏组件检修规程》"}, {"id": 503, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 53, "text": "光伏电站检修工作开始前，应收集前期运维和检修资料和相关缺陷测试结果；检查绝缘手套、绝缘靴、组件特性测试仪、直流钳形表、电流表、万用表、绝缘电阻测试仪、红外测温仪等，测量设备精度应不低于__级。", "options": [], "answer": "0.5", "source": ""}, {"id": 504, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 54, "text": "光伏发电系统应在逆变器输出汇总点设置易于操作、__、且具有明显断开点的开关设备，以确保电力设施检修维护人员的人身安全。", "options": [], "answer": "可闭锁", "source": "依据 GB/T 29319-2012《光伏发电系统接入配电网技术规定》"}, {"id": 505, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 55, "text": "运行人员应经过岗前培训、考核合格，且健康状况符合上岗条件，方可正式上岗， 新聘员工应经过至少3个月的实习期，实习期内不得__口", "options": [], "answer": "独立工作", "source": ""}, {"id": 506, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 56, "text": "光伏电站功率输出受温度和光照强度等环境因素的影响，在多云天气下，最大可达光伏电站装机容量的__%左右。", "options": [], "answer": "25", "source": "依据《光伏发电设备维护与检修》 华电集团有限公司 2023版"}, {"id": 507, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 57, "text": "对 50km 及以下短线路，当纤芯资源允许时，线路纵联保护可使用__。", "options": [], "answer": "专用光纤芯", "source": "依据 GB/T14285-2023《继电保护和安全自动装置技术规程》"}, {"id": 508, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 58, "text": "同条件下某一汇流箱发电量小于同一逆变器其他汇流箱__%以上，可认为影响光伏方阵的正常运行。", "options": [], "answer": "15", "source": "依据 GB/T 36568-2018《光伏方阵检修规程》"}, {"id": 509, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 59, "text": "变压器在额定电压下二次侧开路时，其铁芯中消耗的功率称为__。", "options": [], "answer": "铁损", "source": ""}, {"id": 510, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 60, "text": "光伏发电站向电网调度机构提供的信号应包括光伏发电站高压断路器和隔离开关的__。", "options": [], "answer": "位置", "source": "依据 GB/T 199964-2012《光伏发电站接入电力系统技术规定》"}, {"id": 511, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 61, "text": "在带电的低压配电装置上工作时，应采取防止__和单相接地的绝缘隔离措施。", "options": [], "answer": "相间短路", "source": ""}, {"id": 512, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 62, "text": "光伏并网运行（仅对三相输出）时，电网接口处的三相电压不平衡度允许值为__，短时不得超过 4%。", "options": [], "answer": "2%", "source": "依据 GB/T 19939-2005《光伏系统并网技术要求》"}, {"id": 513, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 63, "text": "光伏支架应具有接地连接，作业之前，必要时应进行__。", "options": [], "answer": "导通测试", "source": "依据 GB/T 35694-2017《光伏发电站安全规程》"}, {"id": 514, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 64, "text": "如果电机长期在偏心状态下工作，轴承时常承受非正常冲击力作用，会导致轴承__和烧死。", "options": [], "answer": "保持架破裂", "source": ""}, {"id": 515, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 65, "text": "蓄电池组的电压可采用 220V 或 110V。蓄电池组应以__方式运行。", "options": [], "answer": "全浮充电", "source": ""}, {"id": 516, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 66, "text": "液压变桨系统须配置储能装置，蓄能器应满足液压缸在规定载荷情况下工作，以满足设计要求的__变桨距速率在整个变桨距角范围内完成顺桨的能力。", "options": [], "answer": "最大", "source": ""}, {"id": 517, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 67, "text": "影响油品氧化的主要因素为油的化学组成、__、氧气浓度、催化剂、压力及氧化时间、金属及绝缘材料、电场等。", "options": [], "answer": "温度", "source": "依据《电力用油气检测及监督管理题库》中国华电电力科学研究院 2020 版"}, {"id": 518, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 68, "text": "取气样的容器应使用密封良好的__或气体采样袋。", "options": [], "answer": "玻璃注射器", "source": "依据 DL/T 722-2014《变压器油中溶解气体分析和判断导则》"}, {"id": 519, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 69, "text": "按照对照自评、__、__、综合评定四个环节对总部部门、中心党组织学习贯彻落实习近平总书记重要指示批示精神情况进行评估。", "options": [], "answer": "过程评价；满意度测评", "source": ""}, {"id": 520, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 70, "text": "停运__个月以上重新投运的设备，应进行预防性试验。", "options": [], "answer": "6", "source": "依据 DL/T 596-2021《电力设备预防性试验规程》"}, {"id": 521, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 71, "text": "测风塔历史数据要求包括 10m、__以及轮毂高程的风速和风向以及气温、气压等信息。", "options": [], "answer": "50m", "source": ""}, {"id": 522, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 72, "text": "坚持常态化组织开展学习贯彻落实习近平总书记重要指示批示精神情况__，重点督促检查习近平总书记关于国家重大战略、国资国企发展改革和党的建设、__能源电力、绿色转型等方面重要指示批示精神以及往年作出需要长期贯彻的重要指示批示精神的落地落实情况，并总结经验，检视问题，查找差距，形成长效机制。", "options": [], "answer": "“回头看”", "source": ""}, {"id": 523, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 73, "text": "关于光伏发电站内 10kV 或 35kV 系统的中性点，经汇集形成光伏发电站群的大、中型光伏发电站，其站内汇集系统宜采用__接地或小电阻接地的方式。", "options": [], "answer": "经消弧线圈", "source": "依据 GB/T 50797-2012《光伏电站设计规范》"}, {"id": 524, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 74, "text": "目前风力发电机组使用的风速传感器主要为__和 _风向传感器。", "options": [], "answer": "机械风杯式，超声波风速", "source": ""}, {"id": 525, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 75, "text": "集团公司党组会议“第一议题”应聚焦习近平总书记关于国家重大战略、__、__、__等方面的重要讲话和重要指示批示精神，增强联系本企业本行业实际的针对性和实效性。", "options": [], "answer": "国资国企发展改革和党的建设；能源电力；绿色转型", "source": ""}, {"id": 526, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 76, "text": "使用携带型火炉或喷灯的工作场所应通风良好，火焰与带电部分的距离：电压在 10kV 及以下者，不得小于1.5m; 电压在10kV 以上者，不得小于__m。", "options": [], "answer": "3", "source": ""}, {"id": 527, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 77, "text": "学习贯彻落实习近平总书记重要指示批示精神工作表单实行__，明确__责任，专人盯办，即时跟进，按时交账，确保办理落实情况可跟踪、可追溯。", "options": [], "answer": "“一议题一表单”", "source": ""}, {"id": 528, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 78, "text": "检查光伏组件是否有开裂、弯曲、不规整、外表面损伤及破碎。破碎部分影响安全或发电量时，应__。", "options": [], "answer": "更换光伏组件", "source": "依据 GB/T 36567-2018《光伏组件检修规程》"}, {"id": 529, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 79, "text": "对于接入 220kV 及以上电压等级的光伏发电站应配置__。", "options": [], "answer": "相角测量系统（PMU）", "source": "依据 GB/T 199964-2012《光伏发电站接入电力系统技术规定》"}, {"id": 530, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 80, "text": "低电阻接地系统每段汇集母线接地点失去时，应断开汇集母线__。", "options": [], "answer": "所有断路器", "source": "依据 DL/T1631-2016《并网风电场继电保护配置及整定技术规范》"}, {"id": 531, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 81, "text": "小型光伏电站，安装容量小于或等于__MW, 通常采用 0.4 ~ 10kV 电压等级。", "options": [], "answer": "1", "source": "依据《光伏发电设备维护与检修》华电集团有限公司 2023 版"}, {"id": 532, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 82, "text": "新能源远程集控中心构筑物包括__、机房及配套设备设施、办公室、交接班室、培训室、更衣室、临时休息室、资料/工具室等。", "options": [], "answer": "监控室", "source": "依据《中国华电集团有限公司新能源远程集控中心构筑物配置指导意见（试行）》 中国华电函〔2023〕113 号"}, {"id": 533, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 83, "text": "学习贯彻落实习近平总书记重要指示批示精神情况的报送，按照党组织重大事项请示报告制度要求执行。各直属单位党委__向集团公司党组专报一次，并抓好所属企业组织实施工作。", "options": [], "answer": "每年年初", "source": ""}, {"id": 534, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 84, "text": "布置有酸性电解液且为非密闭结构电池的电池室，墙面及顶棚应涂耐酸漆，地面应采用易于清洗的耐酸材料，地面标高宜低于相邻房间和过道的地面标高不小于__，并应设置坡度不小于 0.5%的排水坡度，通过耐酸的排水管沟排至室外作妥善处理。", "options": [], "answer": "20mm", "source": "依据 GB/T 36276-2018《电化学储能电站设计规范》"}, {"id": 535, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 85, "text": "风功率密度是统计周期内__高度风功率密度平均值。", "options": [], "answer": "轮毂", "source": "依据《中国华电集团有限公司新能源生产指标评价管理办法》（中国华电生制〔2023〕19 号）"}, {"id": 536, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 86, "text": "对于大于 500MW 规划容量的光伏发电站，其防洪设计应按不小于__年一遇的高水位防洪标准设计。", "options": [], "answer": "100", "source": "依据 GB/T 50797-2012《光伏电站设计规范》"}, {"id": 537, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 87, "text": "检修耦合电容器之前，应合上__,该隔离开关的操作应在耦合电容器无故障时进行。", "options": [], "answer": "短路接地隔离开关", "source": ""}, {"id": 538, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 88, "text": "光伏发电站的无功容量应按照__的原则进行配置。", "options": [], "answer": "分（电压）层和分（电）区基本平衡", "source": "依据 GB/T 199964-2012 《光伏发电站接入电力系统技术规定》"}, {"id": 539, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 89, "text": "纵联保护的微机线路保护装置如需停用直流电源，应在__停用后，才允许停直流电源。", "options": [], "answer": "两侧纵联保护", "source": "依据 DL/T587-2016《继电保护和安全自动装置运行管理规程》"}, {"id": 540, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 90, "text": "山谷风是多山地区经常出现的多种气流模式，从当日20时到次日8时左右为__作用时段。", "options": [], "answer": "山风", "source": ""}, {"id": 541, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 91, "text": "中型储能电站的电站功率__。", "options": [], "answer": "大于等于 5MW 小于 100MW", "source": "依据 GB/T 36276-2018《电化学储能电站设计规范》"}, {"id": 542, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 92, "text": "储能电站主控制室（楼）、继电器室、配电装置室（楼）、电池室等主要建筑设计使用年限不低于__年。", "options": [], "answer": "50", "source": "依据 GB/T 36276-2018《电化学储能电站设计规范》 "}, {"id": 543, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 93, "text": "组件短接时，输出电压为 0，流经组件内的电流即为__Ige, 反映的是电池对光生载流子的收集能力，其与光照强度成正比。", "options": [], "answer": "短路电流", "source": "依据《光伏发电设备维护与检修》 华电集团有限公司 2023 版"}, {"id": 544, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 94, "text": "光伏汇流箱的接地导通性能检测中，接地电阻不应超过__Ω。", "options": [], "answer": "1", "source": "依据《光伏发电设备维护与检修》华电集团有限公司 2023 版"}, {"id": 545, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 95, "text": "密封式储油柜注油时，应设法排尽变压器内死角处积存的__。", "options": [], "answer": "空气", "source": ""}, {"id": 546, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 96, "text": "偏航找零位功能测试指偏航角度在__时，690V 电缆处于完全垂直状态。", "options": [], "answer": "0±5 °", "source": "依据《中国华电集团有限公司风力发电企业技术监督实施规范》中国华电生函〔2022〕 480 号"}, {"id": 547, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 97, "text": "依据华电集团《电力安全工作规程第5部分：新能源发电及储能》,风力发电机组停止运行后，应切断风力发电机组的__,并将风力发电机组切至__模式。", "options": [], "answer": "远程控制，就地", "source": ""}, {"id": 548, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 98, "text": "监视 220V 直流回路绝缘状态所用直流电压表计的内阻不小于__。", "options": [], "answer": "20k Ω", "source": ""}, {"id": 549, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 99, "text": "停运和新投入的风电机组在投入运行前应检查发电机__,合格后才允许__启动。", "options": [], "answer": "定子、转子绝缘", "source": ""}, {"id": 550, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 100, "text": "储能电站__的设计应考虑全站辅助供电损耗、设备效率、线缆损耗、电池类型、电池充放电深度、电池衰减特性、电池不一致性等因素。", "options": [], "answer": "额定充放电能量", "source": "依据 GB/T 36276-2018《电化学储能电站设计规范》"}, {"id": 551, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 101, "text": "各级党组织应对照“四项标准”，坚持“一季一跟踪、半年一督导、一年一总结”， 建立健全贯彻落实习近平总书记重要指示批示精神工作机制，实现传达学习、研究部署、__落实推动、跟踪督办、__的工作闭环。", "options": [], "answer": "报告反馈", "source": ""}, {"id": 552, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 102, "text": "主变压器主保护采用__保护，包括差动电流速断和比率差动保护，能保护变压器绕组及其引出线的相间短路故障，动作后跳各侧开关。", "options": [], "answer": "差动", "source": "依据《光伏发电设备维护与检修》 华电集团有限公司 2023版"}, {"id": 553, "sec": "填空题", "secIdx": 4, "type": "填空题", "num": 103, "text": "储能电站站用通信电源当采用一体化电源时__，事故放电时间宜为__。", "options": [], "answer": "2h—4h", "source": "依据 GB/T 36276-2018《电化学储能电站设计规范》"}, {"id": 554, "sec": "简答题", "secIdx": 5, "type": "简答题", "num": 1, "text": "第一个百年奋斗目标、第二个百年奋斗目标分别是什么？", "options": [], "answer": "（1）第一个百年奋斗目标：到中国共产党成立100年时全面建成小康社会。 （2）第二个百年奋斗目标：到新中国成立 100 年时建成富强民主文明和谐美丽的 社会主义现代化强国", "source": "", "keywords": ["100年", "第一个百年奋斗目标", "第二个百年奋斗目标"], "criterion": "每个要点50%分值", "answerHtml": "（1）\u003cspan class=\"kw\"\u003e第一个百年奋斗目标\u003c/span\u003e：到中国共产党成立\u003cspan class=\"kw\"\u003e100年\u003c/span\u003e时全面建成小康社会。 （2）\u003cspan class=\"kw\"\u003e第二个百年奋斗目标\u003c/span\u003e：到新中国成立 100 年时建成富强民主文明和谐美丽的 社会主义现代化强国"}, {"id": 555, "sec": "简答题", "secIdx": 5, "type": "简答题", "num": 2, "text": "全面建设社会主义现代化国家，是一项伟大而艰巨的事业，前途光明，任重道 远。前进道路上，必须牢牢把握哪些重大原则？", "options": [], "answer": "（1）坚持和加强党的全面领导 （2）坚持以人民为中心的发展思想 （3）坚持中国特色社会主义道路 （4）坚持深化改革开放", "source": "", "keywords": ["坚持和加强党的全面领导", "坚持以人民为中心的发展思想", "坚持中国特色社会主义道路", "坚持深化改革开放"], "criterion": "每个要点25%分值。", "answerHtml": "（1）\u003cspan class=\"kw\"\u003e坚持和加强党的全面领导\u003c/span\u003e （2）\u003cspan class=\"kw\"\u003e坚持以人民为中心的发展思想\u003c/span\u003e （3）\u003cspan class=\"kw\"\u003e坚持中国特色社会主义道路\u003c/span\u003e （4）\u003cspan class=\"kw\"\u003e坚持深化改革开放\u003c/span\u003e"}, {"id": 556, "sec": "简答题", "secIdx": 5, "type": "简答题", "num": 3, "text": "2024年 2月29日下午，习近平总书记主持中共中央政治局第十二次集体学习 时强调，大力推动我国新能源高质量发展，为共建清洁美丽世界作出更大贡献。你单位 将要召开党委会议传达学习习近平总书记的重要讲话精神，请简要回答如何做好传达学 习组织工作和议定事项督办工作？", "options": [], "answer": "（1）第一时间报请党委书记审定党委会“第一议题”内容，通知战略 规划、工程建设、科技创新等相关部门，研究提出贯彻落实措施建议，经分管领导审核 后报党委书记审批，统筹做好学习资料准备工作。（2）会后，根据党委会议部署，组 织相关部门细化措施清单和进度安排，填写《学习贯彻落实工作表单》。（3）督促责 任部门每季度梳理一次贯彻落实进展情况，党委综合部门每半年形成督查报告并汇报党 委和抄送纪委。（4）年底全面梳理总结贯彻落实情况，按要求向上级党组织报送报告", "source": "", "keywords": ["年底全面梳理总结贯彻落实情况", "学习贯彻落实工作表单"], "criterion": "按照每项25%占比，每回答正确一项得分25%，回答4项及以上得满分", "answerHtml": "（1）第一时间报请党委书记审定党委会“第一议题”内容，通知战略 规划、工程建设、科技创新等相关部门，研究提出贯彻落实措施建议，经分管领导审核 后报党委书记审批，统筹做好学习资料准备工作。（2）会后，根据党委会议部署，组 织相关部门细化措施清单和进度安排，填写《\u003cspan class=\"kw\"\u003e学习贯彻落实工作表单\u003c/span\u003e》。（3）督促责 任部门每季度梳理一次贯彻落实进展情况，党委综合部门每半年形成督查报告并汇报党 委和抄送纪委。（4）\u003cspan class=\"kw\"\u003e年底全面梳理总结贯彻落实情况\u003c/span\u003e，按要求向上级党组织报送报告"}, {"id": 557, "sec": "简答题", "secIdx": 5, "type": "简答题", "num": 4, "text": "党的二十大的主题是什么？", "options": [], "answer": "高举中国特色社会主义伟大旗帜，全面贯彻新时代中国特色社会主义思 想，弘扬伟大建党精神，自信自强、守正创新，踔厉奋发、勇毅前行，为全面建设社会 主义现代化国家、全面推进中华民族伟大复兴而团结奋斗", "source": "", "keywords": ["高举中国特色社会主义伟大旗帜"], "criterion": "根据答题情况酌情给分", "answerHtml": "\u003cspan class=\"kw\"\u003e高举中国特色社会主义伟大旗帜\u003c/span\u003e，全面贯彻新时代中国特色社会主义思 想，弘扬伟大建党精神，自信自强、守正创新，踔厉奋发、勇毅前行，为全面建设社会 主义现代化国家、全面推进中华民族伟大复兴而团结奋斗"}, {"id": 558, "sec": "简答题", "secIdx": 5, "type": "简答题", "num": 5, "text": "简要回答学习贯彻落实习近平总书记重要指示批示精神“一季一跟踪、半年一 督导、一年一总结”的内涵？", "options": [], "answer": "坚持问题导向，总部各部门每季度进行梳理总结。党组办公室（党委综 合部门）综合运用企业自查、书面函查、实地督查、核查复核、督促整改等方式，每半 年形成工作情况报告，报经党组（党委）书记审批同意后进行通报。集团公司党组每年 年初将上一年度学习贯彻落实情况向党中央报告，同时专报国务院国资委党委。各直属 单位党委每年年初向集团公司党组专报一次，并抓好所属企业组织实施工作", "source": "", "keywords": ["坚持问题导向"], "criterion": "根据回答内容完整程度，酌情评分", "answerHtml": "\u003cspan class=\"kw\"\u003e坚持问题导向\u003c/span\u003e，总部各部门每季度进行梳理总结。党组办公室（党委综 合部门）综合运用企业自查、书面函查、实地督查、核查复核、督促整改等方式，每半 年形成工作情况报告，报经党组（党委）书记审批同意后进行通报。集团公司党组每年 年初将上一年度学习贯彻落实情况向党中央报告，同时专报国务院国资委党委。各直属 单位党委每年年初向集团公司党组专报一次，并抓好所属企业组织实施工作"}, {"id": 559, "sec": "简答题", "secIdx": 5, "type": "简答题", "num": 6, "text": "简要回答发生哪些情形，学习贯彻落实习近平总书记重要指示批示精神工作跟 踪问效结果评定为“一般”？", "options": [], "answer": "有下列情形之一的，跟踪问效结果定为“一般”： （1）综合得分\u003c70 分。 （2）学习贯彻落实工作不担当、不用力、走过场，存在形式主义、官僚主义，尤其 是不敬畏不在乎、空泛表态，搞“低级红”“高级黑”，有令不行、有禁不止，弄虚作 假、阳奉阴违等问题。 （3）直属单位改革发展和党的建设出现重大问题，经集团公司党组审定，应当评定 为“一般”的情形", "source": "", "keywords": ["70 分", "有下列情形之一的", "综合得分\u003c70 分", "学习贯彻落实工作不担当"], "criterion": "根据回答内容完整程度，酌情评分", "answerHtml": "\u003cspan class=\"kw\"\u003e有下列情形之一的\u003c/span\u003e，跟踪问效结果定为“一般”： （1）\u003cspan class=\"kw\"\u003e综合得分&lt;\u003cspan class=\"kw\"\u003e70 分\u003c/span\u003e\u003c/span\u003e。 （2）\u003cspan class=\"kw\"\u003e学习贯彻落实工作不担当\u003c/span\u003e、不用力、走过场，存在形式主义、官僚主义，尤其 是不敬畏不在乎、空泛表态，搞“低级红”“高级黑”，有令不行、有禁不止，弄虚作 假、阳奉阴违等问题。 （3）直属单位改革发展和党的建设出现重大问题，经集团公司党组审定，应当评定 为“一般”的情形"}, {"id": 560, "sec": "简答题", "secIdx": 5, "type": "简答题", "num": 7, "text": "党的二十大报告指出，从现在起，中国共产党的中心任务是什么？", "options": [], "answer": "团结带领全国各族人民全面建成社会主义现代化强国、实现第二个百年 奋斗目标，以中国式现代化全面推进中华民族伟大复兴", "source": "", "keywords": ["实现第二个百年 奋斗目标", "以中国式现代化全面推进中华民族伟大复兴"], "criterion": "根据答题情况酌情给分", "answerHtml": "团结带领全国各族人民全面建成社会主义现代化强国、\u003cspan class=\"kw\"\u003e实现第二个百年 奋斗目标\u003c/span\u003e，\u003cspan class=\"kw\"\u003e以中国式现代化全面推进中华民族伟大复兴\u003c/span\u003e"}, {"id": 561, "sec": "简答题", "secIdx": 5, "type": "简答题", "num": 8, "text": "简要回答如何做好党组（党委）会议“第一议题”责任落实？", "options": [], "answer": "（1）各级党组织应把抓好学习贯彻落实习近平总书记重要指示批示工 作作为重要政治责任、领导责任、工作责任、监督责任，作为必须严格遵守的政治纪律 和政治规矩，着力完善学习贯彻落实工作责任制。（2）强化党组（党委）学习贯彻落 实习近平总书记重要指示批示精神的主体责任。（3）明确党组（党委）主要负责同志 是学习贯彻落实的第一责任人，对学习贯彻落实工作负总责。（4）分管负责同志按照 职责分工，对分管领域的学习贯彻落实工作具体负责。（5）党组办公室（党委综合部 门）是学习贯彻落实工作的归口管理部门，各部门、各单位要将党组（党委）会议“第 一议题”学习传达一贯到底，按照要求研提贯彻落实建议，推动落实“第一议题”议定 - 19 - 事项", "source": "", "keywords": ["强化党组", "明确党组", "分管负责同志按照 职责分工", "党组办公室"], "criterion": "按照每项20%占比，每回答正确一项得分20%，回答5项及以上得满分", "answerHtml": "（1）各级党组织应把抓好学习贯彻落实习近平总书记重要指示批示工 作作为重要政治责任、领导责任、工作责任、监督责任，作为必须严格遵守的政治纪律 和政治规矩，着力完善学习贯彻落实工作责任制。（2）\u003cspan class=\"kw\"\u003e强化党组\u003c/span\u003e（党委）学习贯彻落 实习近平总书记重要指示批示精神的主体责任。（3）\u003cspan class=\"kw\"\u003e明确党组\u003c/span\u003e（党委）主要负责同志 是学习贯彻落实的第一责任人，对学习贯彻落实工作负总责。（4）\u003cspan class=\"kw\"\u003e分管负责同志按照 职责分工\u003c/span\u003e，对分管领域的学习贯彻落实工作具体负责。（5）\u003cspan class=\"kw\"\u003e党组办公室\u003c/span\u003e（党委综合部 门）是学习贯彻落实工作的归口管理部门，各部门、各单位要将党组（党委）会议“第 一议题”学习传达一贯到底，按照要求研提贯彻落实建议，推动落实“第一议题”议定 - 19 - 事项"}, {"id": 562, "sec": "简答题", "secIdx": 5, "type": "简答题", "num": 9, "text": "党的二十大的主题是什么？", "options": [], "answer": "高举中国特色社会主义伟大旗帜，全面贯彻新时代中国特色社会主义思 想，弘扬伟大建党精神，自信自强、守正创新，踔厉奋发、勇毅前行，为全面建设社会 主义现代化国家、全面推进中华民族伟大复兴而团结奋斗", "source": "", "keywords": ["高举中国特色社会主义伟大旗帜"], "criterion": "根据答题情况酌情给分", "answerHtml": "\u003cspan class=\"kw\"\u003e高举中国特色社会主义伟大旗帜\u003c/span\u003e，全面贯彻新时代中国特色社会主义思 想，弘扬伟大建党精神，自信自强、守正创新，踔厉奋发、勇毅前行，为全面建设社会 主义现代化国家、全面推进中华民族伟大复兴而团结奋斗"}, {"id": 563, "sec": "简答题", "secIdx": 5, "type": "简答题", "num": 10, "text": "简要回答学习贯彻落实习近平总书记重要指示批示精神“一季一跟踪、半年一 督导、一年一总结”的内涵？", "options": [], "answer": "坚持问题导向，总部各部门每季度进行梳理总结。党组办公室（党委综 合部门）综合运用企业自查、书面函查、实地督查、核查复核、督促整改等方式，每半 年形成工作情况报告，报经党组（党委）书记审批同意后进行通报。集团公司党组每年 年初将上一年度学习贯彻落实情况向党中央报告，同时专报国务院国资委党委。各直属 单位党委每年年初向集团公司党组专报一次，并抓好所属企业组织实施工作", "source": "", "keywords": ["坚持问题导向"], "criterion": "根据回答内容完整程度，酌情评分", "answerHtml": "\u003cspan class=\"kw\"\u003e坚持问题导向\u003c/span\u003e，总部各部门每季度进行梳理总结。党组办公室（党委综 合部门）综合运用企业自查、书面函查、实地督查、核查复核、督促整改等方式，每半 年形成工作情况报告，报经党组（党委）书记审批同意后进行通报。集团公司党组每年 年初将上一年度学习贯彻落实情况向党中央报告，同时专报国务院国资委党委。各直属 单位党委每年年初向集团公司党组专报一次，并抓好所属企业组织实施工作"}, {"id": 564, "sec": "简答题", "secIdx": 5, "type": "简答题", "num": 11, "text": "什么是瓦斯保护?有哪些优缺点?", "options": [], "answer": "(1)当变压器内部发生故障时，变压器油将分解出大量气体，利用这种气体动作的保护装置称为瓦斯保护。 (2)瓦斯保护的动作速度快、灵敏度高，对变压器内部绕组匝间短路及油面降低、铁 芯过热等本体内的任何故障有良好的反应能力，但对油箱外套管及连线上的故障反应能力却很差", "source": "", "keywords": ["当变压器内部发生故障时", "瓦斯保护的动作速度快"], "criterion": "", "answerHtml": "(1)\u003cspan class=\"kw\"\u003e当变压器内部发生故障时\u003c/span\u003e，变压器油将分解出大量气体，利用这种气体动作的保护装置称为瓦斯保护。 (2)\u003cspan class=\"kw\"\u003e瓦斯保护的动作速度快\u003c/span\u003e、灵敏度高，对变压器内部绕组匝间短路及油面降低、铁 芯过热等本体内的任何故障有良好的反应能力，但对油箱外套管及连线上的故障反应能力却很差"}, {"id": 565, "sec": "问答题", "secIdx": 6, "type": "问答题", "num": 1, "text": "依据《光伏发电设备维护与检修》第十三章第二节第一部分的规定：请简述光伏支架巡视检查内容（至少 9 项）。", "options": [], "answer": "（1）桩基检查，混凝土基础有无沉降、位移、开裂、剥落、风化、露筋； PHC 管桩是否有沉降、开裂、倾斜。 （2）变形、构件与结构体系检查，检查支架结构件檩条、支架梁、支架柱、斜撑等是否有变形，结构体系是否发生损坏。 （3）连接与节点检查，检查连接件/转接件之间栓接或焊接节点应无松动或脱焊、变形迹象。 （4）地基基础检查，检查软弱地基、山区地基、湿陷性黄土地基、膨胀土地基、冻土地基等特殊性土地基础区域应检查是否有基础变形，有无潜在风险或直接危害的滑坡、泥石流、崩塌、滚石等。 （5）防腐检查，检查支架防腐保护层外观检查，涂层破损情况，有无鼓泡脱漆、剥落开裂、腐蚀生锈迹象，测定金属性结构件防腐镀层漆膜厚度达标，金属性支架年度腐蚀速率满足标准要求。 （6）接地系统检查，检查各部件接地是否连接可靠，铜编织带是否有断股、断开现象，栓接或焊接节点应无松动或脱焊、变形迹象。 （7）载荷与作用组合（风、雪）检查，恶劣风雪天气前，针对跟踪光伏支架系统应检查其风雪模式是否正常运行。 （8）跟踪控制系统检查，检查跟踪系统通信是否正常，屏蔽与接地是否良好；箱体密封应良好，内部无异音、异味，电源指示灯正常。 （9）驱动单元检查，检查电机、减速机电源是否正常，安装是否紧固，有无松动：轴承是否有异响、发热、漏油迹象，防护罩是否完整，外观检查是否有裂纹；地脚接地是否正常，周围有无影响其正常运行的异物、不 利因素。 （10）支撑传动单元检查，检查与主轴推杆连接件、立柱连接是否紧固可靠，有无偏移倾斜迹象。 （11）转动主梁单元检查，检查主梁、轴承座与轴承连接是否可靠：主梁是否在一条水平线上；限位角钢与硬限位是否有移位、变形；转动轴承有无移位、外滑迹象。 （12）阻尼器检查，检查阻尼器与主梁、立柱梁连接是否可靠，螺栓是否紧固，阻尼器外观有无破损、损坏，运行有无异常情况。 （13）电缆检查，检查电缆是否
